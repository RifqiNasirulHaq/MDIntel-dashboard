<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Merchandising Intelligence PT MRM</title>
<style>
:root {
  --gd:#264C47; --cb:#BA9F87; --bb:#466689;
  --cs:#EEDDCA; --gs:#86AFAA;
  --bg:#F5F3EF; --white:#fff;
  --g1:#F0EDE8; --g2:#E2DDD6; --g4:#B0A899; --g6:#7A7268; --g8:#3A3530;
  --tx:#1E2B28; --mt:#6B7870;
  --cm:#264C47;  --cm-bg:#DFF0EC; /* Maintain - hijau */
  --cp:#8B5E0A;  --cp-bg:#FEF3DC; /* Push - kuning */
  --cr:#B83030;  --cr-bg:#FDECEA; /* Replenish - merah */
  --ci:#5F5955;  --ci-bg:#EEEBE6; /* Idle - abu */
  --cmo:#466689; --cmo-bg:#E8EEF5;/* Monitor - biru */
  --fd:'Georgia','Times New Roman',serif;
  --fb:-apple-system,'Segoe UI',sans-serif;
  --fm:'SF Mono','Fira Code','Consolas',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);font-family:var(--fb);color:var(--tx);min-height:100vh}

/* HEADER */
.hdr{background:var(--gd);padding:18px 28px 14px;display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:12px}
.hdr-l h1{font-family:var(--fd);font-size:20px;font-weight:normal;color:var(--cs);letter-spacing:.02em}
.hdr-l .sub{font-size:9px;color:var(--gs);margin-top:3px;letter-spacing:.08em;text-transform:uppercase}
.hdr-r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.live{display:flex;align-items:center;gap:5px;background:rgba(134,175,170,.15);border:1px solid rgba(134,175,170,.3);color:var(--gs);padding:4px 10px;border-radius:12px;font-size:10px;letter-spacing:.04em}
.dot{width:6px;height:6px;background:#4CAF7D;border-radius:50%;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.meta{font-size:10px;color:var(--gs);text-align:right;line-height:1.6}
.meta span{color:var(--cs);font-family:var(--fm);font-size:11px}
.rfbtn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:var(--cs);padding:6px 13px;border-radius:6px;font-size:11px;cursor:pointer;transition:background .2s;letter-spacing:.03em}
.rfbtn:hover{background:rgba(255,255,255,.16)}

/* NAV */
.nav{background:var(--gd);border-top:1px solid rgba(255,255,255,.08);padding:0 28px;display:flex;gap:0}
.nb{padding:9px 18px;font-size:11px;font-weight:500;cursor:pointer;border:none;background:none;color:rgba(238,221,202,.5);border-bottom:2px solid transparent;transition:all .15s;letter-spacing:.03em}
.nb:hover{color:var(--cs)}
.nb.act{color:var(--cs);border-bottom-color:var(--cb)}

/* MAIN */
.main{padding:20px 28px;max-width:1500px;margin:0 auto}
.page{display:none}.page.act{display:block}

/* STATE */
.st{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 20px;gap:14px;color:var(--mt)}
.spin{width:34px;height:34px;border:3px solid var(--g2);border-top-color:var(--gd);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pw{width:260px;background:var(--g2);border-radius:4px;height:5px;overflow:hidden;margin-top:4px}
.pb{height:100%;background:var(--gd);border-radius:4px;transition:width .3s}

/* KPI */
.krow{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:18px}
.kc{background:var(--white);border-radius:9px;padding:13px 14px;border-top:3px solid var(--g2);cursor:pointer;transition:all .15s}
.kc:hover{transform:translateY(-1px);box-shadow:0 3px 12px rgba(0,0,0,.08)}
.kc.active{box-shadow:0 0 0 2px currentColor}
.kc.kt{border-top-color:var(--bb)}
.kc.km{border-top-color:var(--cm)}
.kc.kp{border-top-color:var(--cp)}
.kc.krp{border-top-color:var(--cr)}
.kc.ki{border-top-color:var(--ci)}
.kc.kmo{border-top-color:var(--cmo)}
.kc.krs{border-top-color:var(--cb)}
.kl{font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--mt);margin-bottom:4px}
.kv{font-size:22px;font-weight:700;line-height:1}
.ks{font-size:10px;color:var(--mt);margin-top:3px}

/* CONTROLS */
.ctrl{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.sw{position:relative;flex:1;min-width:160px;max-width:280px}
.sw input{width:100%;padding:7px 10px 7px 28px;border:1px solid var(--g2);border-radius:7px;font-size:12px;background:var(--white);color:var(--tx);outline:none}
.sw input:focus{border-color:var(--gs)}
.si{position:absolute;left:8px;top:50%;transform:translateY(-50%);color:var(--g4);font-size:13px;pointer-events:none}
.fg{display:flex;gap:5px;flex-wrap:wrap}
.fb{padding:5px 12px;border-radius:20px;font-size:11px;font-weight:500;cursor:pointer;border:1.5px solid var(--g2);background:var(--white);color:var(--mt);transition:all .15s}
.fb:hover{border-color:var(--g4)}
.fb.f-all{background:var(--gd);color:var(--white);border-color:var(--gd)}
.fb.f-m{background:var(--cm-bg);color:var(--cm);border-color:var(--cm)}
.fb.f-p{background:var(--cp-bg);color:var(--cp);border-color:var(--cp)}
.fb.f-r{background:var(--cr-bg);color:var(--cr);border-color:var(--cr)}
.fb.f-i{background:var(--ci-bg);color:var(--ci);border-color:var(--ci)}
.fb.f-mo{background:var(--cmo-bg);color:var(--cmo);border-color:var(--cmo)}
.ss{padding:6px 10px;border:1px solid var(--g2);border-radius:7px;font-size:11px;background:var(--white);color:var(--tx);cursor:pointer;outline:none}

/* TABLE */
.tw{background:var(--white);border-radius:10px;overflow:hidden;border:1px solid var(--g2)}
.tbr{padding:11px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--g2)}
.tt{font-size:12px;font-weight:600;color:var(--tx)}
.tc{font-size:11px;color:var(--mt)}
table{width:100%;border-collapse:collapse;font-size:12px}
thead th{padding:8px 12px;text-align:left;font-size:9px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--mt);background:var(--g1);border-bottom:1px solid var(--g2);cursor:pointer;user-select:none;white-space:nowrap}
thead th:hover{color:var(--tx)}
th.sa::after{content:" ↑"}th.sd::after{content:" ↓"}
tbody tr{border-bottom:1px solid var(--g2);transition:background .1s}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:var(--g1)}
td{padding:9px 12px;vertical-align:middle}
td.rk{color:var(--g4);font-size:11px;width:28px;font-family:var(--fm)}
td.sk{font-weight:600;color:var(--gd);font-size:12px}
td.nm{text-align:right;font-family:var(--fm);font-size:11px}

/* WC BAR */
.ww{display:flex;align-items:center;gap:6px;min-width:95px}
.wn{font-family:var(--fm);font-size:11px;min-width:32px;text-align:right}
.wbg{flex:1;height:5px;background:var(--g2);border-radius:3px;overflow:hidden}
.wf{height:100%;border-radius:3px;transition:width .4s}

/* KONDISI BADGE */
.bdg{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:600;white-space:nowrap}
.bdd{width:5px;height:5px;border-radius:50%}
.bM{background:var(--cm-bg);color:var(--cm)}.bM .bdd{background:var(--cm)}
.bP{background:var(--cp-bg);color:var(--cp)}.bP .bdd{background:var(--cp)}
.bR{background:var(--cr-bg);color:var(--cr)}.bR .bdd{background:var(--cr)}
.bI{background:var(--ci-bg);color:var(--ci)}.bI .bdd{background:var(--ci)}
.bMo{background:var(--cmo-bg);color:var(--cmo)}.bMo .bdd{background:var(--cmo)}

/* PILLS */
.pill{display:inline-block;padding:2px 7px;border-radius:9px;font-size:10px;font-family:var(--fm)}
.pneed{background:var(--cr-bg);color:var(--cr);font-weight:700}
.pintake{background:var(--cm-bg);color:var(--cm);font-weight:700}
.pfc{background:#EEF3FF;color:var(--bb);font-weight:600}
.pend-ok{background:var(--cm-bg);color:var(--cm);font-weight:700}
.pend-warn{background:var(--cr-bg);color:var(--cr);font-weight:700}
.pzero{color:var(--g4)}

/* REC CELL */
.rc{max-width:200px}
.r1{font-size:10px;color:var(--cm);margin-bottom:2px;line-height:1.4}
.r2{font-size:10px;color:var(--bb);line-height:1.4}
.rl{font-size:8px;text-transform:uppercase;letter-spacing:.06em;color:var(--g4);margin-bottom:1px}

/* CHARTS ROW */
.chrow{display:grid;grid-template-columns:220px 1fr 1fr;gap:12px;margin-top:14px}
.ch{background:var(--white);border-radius:10px;padding:16px;border:1px solid var(--g2)}
.cht{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--mt);margin-bottom:12px}
.dw{display:flex;align-items:center;gap:14px}
.dl{flex:1}
.di{display:flex;align-items:center;gap:6px;margin-bottom:7px}
.dd{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.dl2{font-size:11px;flex:1;color:var(--tx)}
.dp{font-size:12px;font-weight:700;font-family:var(--fm)}
.dc{font-size:10px;color:var(--mt);margin-left:2px}
.bi{margin-bottom:9px}
.bh{display:flex;justify-content:space-between;margin-bottom:3px}
.bs{font-size:10px;font-weight:600}
.bv{font-size:10px;font-family:var(--fm);color:var(--mt)}
.btr{height:6px;background:var(--g2);border-radius:4px;overflow:hidden}
.bf{height:100%;border-radius:4px;transition:width .5s}

/* ALERT PAGE */
.al-card{background:var(--white);border-radius:10px;padding:16px;border:1px solid var(--g2);margin-bottom:12px}
.al-ttl{font-size:12px;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.al-chip{padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600}
.al-sub{font-size:11px;color:var(--mt);margin-bottom:10px;line-height:1.5}
.al-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px}
.al-item{padding:9px 11px;border-radius:7px;font-size:11px;border:1px solid transparent}
.al-sku{font-weight:600;margin-bottom:2px}
.al-rev{font-size:10px;color:var(--g6);font-family:var(--fm);margin-bottom:2px}
.al-wc{font-size:10px;font-family:var(--fm);margin-bottom:3px}
.al-rec{font-size:10px;color:var(--g6);line-height:1.4}

/* PAGINATION */
.pag{display:flex;align-items:center;justify-content:center;gap:5px;padding:11px;border-top:1px solid var(--g2)}
.pgb{padding:4px 9px;border:1px solid var(--g2);border-radius:5px;font-size:11px;cursor:pointer;background:var(--white);color:var(--tx);transition:all .15s}
.pgb:hover:not(:disabled){border-color:var(--gd);color:var(--gd)}
.pgb:disabled{opacity:.35;cursor:default}
.pgb.act{background:var(--gd);color:var(--white);border-color:var(--gd)}
.pgi{font-size:11px;color:var(--mt);margin:0 4px}

.footer{text-align:center;padding:14px;font-size:10px;color:var(--g4);margin-top:4px}
@media(max-width:1100px){.krow{grid-template-columns:repeat(4,1fr)}.chrow{grid-template-columns:1fr}}
@media(max-width:700px){.krow{grid-template-columns:repeat(2,1fr)}.main{padding:12px 14px}.hdr{padding:14px}}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-l">
    <h1>Merchandising Intelligence PT MRM</h1>
    <div class="sub">Real-time · Sumber: eng_dashboard · GitHub Pages</div>
  </div>
  <div class="hdr-r">
    <div class="live"><span class="dot"></span>Live</div>
    <div class="meta">
      Last Update <span id="last-update">—</span>
      Week <span id="cur-week">—</span>
    </div>
    <button class="rfbtn" onclick="init()">↻ Refresh</button>
  </div>
</header>

<nav class="nav">
  <button class="nb act" onclick="showPage('overview',this)">Overview</button>
  <button class="nb" onclick="showPage('sku',this)">Detail SKU</button>
  <button class="nb" onclick="showPage('alert',this)">⚡ Alert &amp; Aksi</button>
</nav>

<div class="main">
  <div class="page act" id="page-overview">
    <div class="st"><div class="spin"></div><div id="lmsg">Memuat data...</div><div class="pw"><div class="pb" id="prog" style="width:5%"></div></div></div>
  </div>
  <div class="page" id="page-sku">
    <div class="st"><div class="spin"></div></div>
  </div>
  <div class="page" id="page-alert">
    <div class="st"><div class="spin"></div></div>
  </div>
</div>

<div class="footer">Merchandising Intelligence PT MRM · Sumber: eng_dashboard · Kalkulasi real-time</div>

<script>
// ═══════════════════════════════════════════════
// KONFIGURASI
// ═══════════════════════════════════════════════
const SHEET_ID  = '1wqhs70hjgTE13_BXTPflPJGqZ6i7YIj1jQZ3vs-sgAU';
const GID_ENG   = '1636358761'; // tab eng_dashboard

// ── STATE ──
let ALL=[], filtered=[];
let filt='ALL', srch='', sCol='rank', sDir='asc', pg=1;
const PG=25;

// ═══════════════════════════════════════════════
// UTILITIES
// ═══════════════════════════════════════════════
function pNum(v) {
  if (!v && v!==0) return 0;
  return parseFloat(String(v).trim().replace(/\./g,'').replace(',','.')) || 0;
}

function parseCSV(text) {
  return text.trim().split('\n').map(line => {
    const cols=[]; let cur='', inQ=false;
    for (const ch of line) {
      if (ch==='"'){inQ=!inQ;}
      else if (ch===','&&!inQ){cols.push(cur.trim());cur='';}
      else cur+=ch;
    }
    cols.push(cur.trim());
    return cols;
  });
}

function setMsg(m,p) {
  const e=document.getElementById('lmsg'),b=document.getElementById('prog');
  if(e) e.textContent=m;
  if(b&&p!==undefined) b.style.width=p+'%';
}

function findHdr(rows,...kws) {
  for (let i=0;i<Math.min(rows.length,30);i++) {
    const j=rows[i].join('|').toLowerCase();
    if (kws.every(k=>j.includes(k.toLowerCase()))) return i;
  }
  return -1;
}

// Deteksi index kolom dari header
function colIdx(hdr, keywords, fallback) {
  const i = hdr.findIndex(c => keywords.some(k => c.toLowerCase().includes(k.toLowerCase())));
  return i >= 0 ? i : fallback;
}

// Kondisi → kode singkat
function condCode(raw) {
  const v = (raw||'').toLowerCase().trim();
  if (v.includes('maintain')) return 'M';
  if (v.includes('push'))     return 'P';
  if (v.includes('replenish'))return 'R';
  if (v.includes('idle'))     return 'I';
  if (v.includes('monitor'))  return 'Mo';
  return 'M';
}

const CLABEL = {M:'Maintain', P:'Push', R:'Replenish', I:'Idle', Mo:'Monitor'};
const CCOLOR = {
  M:'#264C47', P:'#8B5E0A', R:'#B83030', I:'#5F5955', Mo:'#466689'
};

function wcColor(code) { return CCOLOR[code]||'#888'; }
function wcBarW(wc) {
  if (!wc||wc<=0) return 0;
  if (wc>=9999) return 100;
  return Math.min(100,(wc/30)*100);
}

// ═══════════════════════════════════════════════
// LOAD DATA
// ═══════════════════════════════════════════════
async function init() {
  ['page-overview','page-sku','page-alert'].forEach(id => {
    document.getElementById(id).innerHTML =
      '<div class="st"><div class="spin"></div><div id="lmsg">Memuat data dari Google Sheets...</div><div class="pw"><div class="pb" id="prog" style="width:5%"></div></div></div>';
  });

  try {
    setMsg('Memuat eng_dashboard...', 20);
    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID_ENG}`;
    const resp = await fetch(url);
    if (!resp.ok) throw new Error(`HTTP ${resp.status} — Pastikan sheet diset publik.`);
    const rows = parseCSV(await resp.text());

    setMsg('Membaca struktur data...', 50);

    // ── Baca metadata (last update, week) dari baris awal ──
    let lastUpdate='—', curWeek='—';
    for (let i=0;i<Math.min(rows.length,10);i++) {
      const joined = rows[i].join('|');
      if (/last.?update/i.test(joined)) {
        // Cari nilai di kolom setelah "Last Update"
        const r=rows[i];
        for (let c=0;c<r.length;c++) {
          if (/last.?update/i.test(r[c]) && r[c+1]) { lastUpdate=r[c+1]; break; }
        }
      }
      if (/\bweek\b/i.test(joined) && !/wks.?cover|avg/i.test(joined)) {
        const r=rows[i];
        for (let c=0;c<r.length;c++) {
          if (/^week$/i.test(r[c].trim()) && r[c+1]) { curWeek=r[c+1]; break; }
        }
      }
    }
    document.getElementById('last-update').textContent = lastUpdate;
    document.getElementById('cur-week').textContent = curWeek;

    // ── Cari header row (mengandung "rank" dan "sku") ──
    const hi = findHdr(rows, 'rank', 'sku');
    if (hi < 0) throw new Error(
      'Header tabel tidak ditemukan di eng_dashboard. Baris pertama: ' +
      (rows[0]||[]).slice(0,6).join(' | ')
    );

    const hdr = rows[hi].map(c => c.toLowerCase().trim());

    // Deteksi posisi kolom secara dinamis
    const iRank  = colIdx(hdr, ['rank'],                     0);
    const iSku   = colIdx(hdr, ['sku'],                      1);
    const iQty   = colIdx(hdr, ['qty ytd','qty'],            2);
    const iRev   = colIdx(hdr, ['revenue ytd','revenue'],    3);
    const iAvail = colIdx(hdr, ['available stock','avail'],  4);
    const iAYtd  = colIdx(hdr, ['avg sale ytd','avg sale y'],5);
    const iA5w   = colIdx(hdr, ['avg sale 5w','avg sale 5'], 6);
    const iWc    = colIdx(hdr, ['wks cover','wk cover','weeks cover'], 7);
    const iKond  = colIdx(hdr, ['kondisi','condition'],      8);
    const iRS    = colIdx(hdr, ['restock needed','restock'], 9);
    const iIntk  = colIdx(hdr, ['intake'],                   10);
    const iFC    = colIdx(hdr, ['reforcasting','reforecast','forecast'], 11);
    const iEnd   = colIdx(hdr, ['ending stock','ending'],    12);
    const iRec1  = colIdx(hdr, ['rekomendasi 1','rec 1','rekomendasi1'], 13);
    const iRec2  = colIdx(hdr, ['rekomendasi 2','rec 2','rekomendasi2'], 14);

    setMsg('Memproses data SKU...', 75);

    // ── Parse data rows ──
    const parsed = [];
    for (let i=hi+1; i<rows.length; i++) {
      const r = rows[i];
      const skuRaw = (r[iSku]||'').trim();
      if (!skuRaw || skuRaw.toLowerCase()==='sku') continue;
      const rank = pNum(r[iRank]);
      if (!rank) continue;

      const kondRaw = (r[iKond]||'').trim();
      const cond = condCode(kondRaw);

      parsed.push({
        rank,
        sku      : skuRaw,
        qty      : pNum(r[iQty]),
        rev      : pNum(r[iRev]),
        avail    : pNum(r[iAvail]),
        avgYtd   : pNum(r[iAYtd]),
        avg5w    : pNum(r[iA5w]),
        wc       : pNum(r[iWc]),
        kondRaw,
        cond,
        restock  : pNum(r[iRS]),
        intake   : pNum(r[iIntk]),
        forecast : pNum(r[iFC]),
        endStock : pNum(r[iEnd]),
        rec1     : (r[iRec1]||'').trim(),
        rec2     : (r[iRec2]||'').trim(),
      });
    }

    if (!parsed.length)
      throw new Error('Tidak ada data SKU ditemukan. Cek struktur header di eng_dashboard.');

    ALL = parsed;
    setMsg('Merender dashboard...', 95);
    applyFilt();
    renderAll();

  } catch(e) {
    const html = `<div class="st">
      <div style="font-size:28px">⚠️</div>
      <div style="font-weight:600;color:#B83030">${e.message}</div>
      <div style="font-size:11px;color:var(--mt);max-width:440px;text-align:center;line-height:1.6">
        Pastikan Google Sheets diset ke <strong>"Anyone with the link can view"</strong><br>
        dan tab <strong>eng_dashboard</strong> bisa diakses.
      </div>
      <button class="rfbtn" style="background:var(--gd);margin-top:12px" onclick="init()">↻ Coba Lagi</button>
    </div>`;
    ['page-overview','page-sku','page-alert'].forEach(id=>{
      document.getElementById(id).innerHTML=html;
    });
  }
}

// ═══════════════════════════════════════════════
// FILTER & SORT
// ═══════════════════════════════════════════════
function applyFilt() {
  filtered = ALL.filter(d => {
    const mF = filt==='ALL' || d.cond===filt;
    const mS = !srch || d.sku.toLowerCase().includes(srch.toLowerCase());
    return mF && mS;
  });
  filtered.sort((a,b)=>{
    const av=a[sCol], bv=b[sCol];
    if (typeof av==='string') return sDir==='asc'?av.localeCompare(bv):bv.localeCompare(av);
    return sDir==='asc'?av-bv:bv-av;
  });
  pg=1;
}

// ═══════════════════════════════════════════════
// FORMAT
// ═══════════════════════════════════════════════
function fN(n,dec=0) {
  if (n===null||n===undefined||n==='') return '—';
  const v=parseFloat(n);
  if (isNaN(v)) return '—';
  return dec>0 ? v.toLocaleString('id-ID',{minimumFractionDigits:dec,maximumFractionDigits:dec})
               : Math.round(v).toLocaleString('id-ID');
}
function fRp(n) {
  if (!n) return '—';
  if (n>=1e9) return 'Rp'+(n/1e9).toFixed(2)+' M';
  if (n>=1e6) return 'Rp'+(n/1e6).toFixed(1)+' jt';
  if (n>=1e3) return 'Rp'+(n/1e3).toFixed(0)+' rb';
  return 'Rp'+n;
}
function thc(c){return sCol===c?(sDir==='asc'?'sa':'sd'):''}

// ═══════════════════════════════════════════════
// DONUT SVG
// ═══════════════════════════════════════════════
function donutSVG(segs) {
  const cx=60,cy=60,r=44,gap=2.5;
  let paths='',cum=-Math.PI/2;
  const tot=segs.reduce((s,d)=>s+d.n,0)||1;
  segs.forEach(s=>{
    const angle=(s.n/tot)*Math.PI*2;
    const end=cum+angle-(gap/r);
    const x1=cx+r*Math.cos(cum),y1=cy+r*Math.sin(cum);
    const x2=cx+r*Math.cos(end),y2=cy+r*Math.sin(end);
    paths+=`<path d="M${cx} ${cy} L${x1} ${y1} A${r} ${r} 0 ${angle>Math.PI?1:0} 1 ${x2} ${y2}Z" fill="${s.color}" opacity=".88"/>`;
    cum+=angle;
  });
  return `<svg width="120" height="120" viewBox="0 0 120 120">
    <circle cx="60" cy="60" r="44" fill="#F0EDE8"/>
    ${paths}
    <circle cx="60" cy="60" r="24" fill="white"/>
    <text x="60" y="57" text-anchor="middle" font-size="16" font-weight="700" fill="#264C47" font-family="Georgia,serif">${tot}</text>
    <text x="60" y="70" text-anchor="middle" font-size="8" fill="#6B7870" font-family="sans-serif">SKU</text>
  </svg>`;
}

function renderAll(){renderOverview();renderSKU();renderAlert();}

    </div>
    <div class="kc kp" onclick="doFiltAndGo('P')">
      <div class="kl">Push</div>
      <div class="kv" style="color:var(--cp)">${cnt.P}</div>
      <div class="ks">Stok tinggi, sales lambat</div>
    </div>
    <div class="kc krp" onclick="doFiltAndGo('R')">
      <div class="kl">Replenish</div>

      <div class="kv" style="color:var(--cmo)">${cnt.Mo}</div>
      <div class="ks">Stok kosong, demand tidak jelas</div>
    </div>
    <div class="kc krs">
      <div class="kl">Total Restock Needed</div>
      <div class="kv" style="color:var(--cb);font-size:18px">${fN(totRS)}</div>
      <div class="ks">unit perlu diintake</div>
    </div>
  </div>

  <!-- CHARTS -->
  <div class="chrow">
    <div class="ch">
      <div class="cht">Distribusi Kondisi</div>
      <div class="dw">
        ${donutSVG(segs)}
        <div class="dl">
          ${segs.map(s=>`<div class="di">
            <div class="dd" style="background:${s.color}"></div>
            <div class="dl2">${s.label}</div>
            <div class="dp" style="color:${s.color}">${Math.round(s.n/dTot*100)}%</div>
            <div class="dc">(${s.n})</div>
          </div>`).join('')}
        </div>
      </div>
    </div>
    <div class="ch">
      <div class="cht">Top 10 Revenue YTD</div>
      ${top10rev.map(d=>`<div class="bi">
        <div class="bh">
          <span class="bs" style="color:${wcColor(d.cond)}">#${d.rank} ${d.sku}</span>

      </div>`).join('')}
    </div>

      ${top10rs.length ? top10rs.map(d=>`<div class="bi">

function renderSKU() {
  const cnt={M:0,P:0,R:0,I:0,Mo:0};
  ALL.forEach(d=>{ if(cnt[d.cond]!==undefined) cnt[d.cond]++; });

  const start=(pg-1)*PG, end=Math.min(start+PG,filtered.length);
  const pgData=filtered.slice(start,end);
  const totPg=Math.ceil(filtered.length/PG);

  const rows=pgData.map(d=>{
    const wc  = d.wc>=9999?'∞':d.wc===0?'0.0':d.wc.toFixed(1);
    const wcc = wcColor(d.cond);
    const endCls = d.endStock<=0 ? 'pend-warn' : d.endStock<d.avg5w*2 ? 'pend-warn' : 'pend-ok';
    return `<tr>
      <td class="rk">${d.rank}</td>
      <td class="sk">${d.sku}</td>
      <td class="nm">${fN(d.qty)}</td>
      <td class="nm">${fRp(d.rev)}</td>
      <td class="nm">${fN(d.avail)}</td>
      <td class="nm">${fN(d.avgYtd,1)}</td>
      <td class="nm">${fN(d.avg5w,1)}</td>
      <td>
        <div class="ww">
          <div class="wn" style="color:${wcc}">${wc}x</div>
          <div class="wbg"><div class="wf" style="width:${wcBarW(d.wc)}%;background:${wcc}"></div></div>
        </div>
      </td>
      <td><span class="bdg b${d.cond}"><span class="bdd"></span>${CLABEL[d.cond]||d.kondRaw}</span></td>
      <td class="nm"><span class="pill ${d.restock>0?'pneed':'pzero'}">${d.restock>0?'+'+fN(d.restock):'—'}</span></td>
      <td class="nm"><span class="pill ${d.intake>0?'pintake':'pzero'}">${d.intake>0?'+'+fN(d.intake):'—'}</span></td>
      <td class="nm"><span class="pill pfc">${d.forecast>0?fN(d.forecast):'—'}</span></td>
      <td class="nm"><span class="pill ${endCls}">${fN(d.endStock)}</span></td>
      <td class="rc">
        <div class="rl">Rekomendasi 1</div>
        <div class="r1">${d.rec1||'—'}</div>
        <div class="rl" style="margin-top:3px">Rekomendasi 2</div>
        <div class="r2">${d.rec2||'—'}</div>
      </td>
    </tr>`;
  }).join('');

  // Pagination
  let pages=[];
  if(totPg<=7){for(let i=1;i<=totPg;i++)pages.push(i);}
  else{
    pages=[1];if(pg>3)pages.push('…');
    for(let i=Math.max(2,pg-1);i<=Math.min(totPg-1,pg+1);i++)pages.push(i);
    if(pg<totPg-2)pages.push('…');pages.push(totPg);
  }
  const pgBtns=pages.map(p=>p==='…'
    ?`<span style="color:var(--mt);padding:0 3px">…</span>`
    :`<button class="pgb ${p===pg?'act':''}" onclick="goPg(${p})">${p}</button>`
  ).join('');

  const condLabel = filt==='ALL'?'Semua Kondisi':(CLABEL[filt]||filt);

  document.getElementById('page-sku').innerHTML=`
  <div class="ctrl">
    <div class="sw"><span class="si">⌕</span>
      <input type="text" placeholder="Cari SKU..." value="${srch}" oninput="doSrch(this.value)">
    </div>
    <div class="fg">
      <button class="fb ${filt==='ALL'?'f-all':''}" onclick="doFilt('ALL')">Semua (${ALL.length})</button>
      <button class="fb ${filt==='M'?'f-m':''}" onclick="doFilt('M')">Maintain (${cnt.M})</button>
      <button class="fb ${filt==='P'?'f-p':''}" onclick="doFilt('P')">Push (${cnt.P})</button>
      <button class="fb ${filt==='R'?'f-r':''}" onclick="doFilt('R')">Replenish (${cnt.R})</button>
      <button class="fb ${filt==='I'?'f-i':''}" onclick="doFilt('I')">Idle (${cnt.I})</button>
      <button class="fb ${filt==='Mo'?'f-mo':''}" onclick="doFilt('Mo')">Monitor (${cnt.Mo})</button>
    </div>
    <select class="ss" onchange="doSort(this.value)">
      <option value="rank"     ${sCol==='rank'    ?'selected':''}>Rank Revenue ↑</option>
      <option value="rev"      ${sCol==='rev'     ?'selected':''}>Revenue ↓</option>
      <option value="wc"       ${sCol==='wc'      ?'selected':''}>Weeks Cover ↑</option>
      <option value="restock"  ${sCol==='restock' ?'selected':''}>Restock Needed ↓</option>
      <option value="endStock" ${sCol==='endStock'?'selected':''}>Ending Stock ↑</option>
      <option value="forecast" ${sCol==='forecast'?'selected':''}>Forecast ↓</option>
    </select>
  </div>
  <div class="tw">
    <div class="tbr">
      <div class="tt">Detail SKU — ${condLabel}</div>
      <div class="tc">Menampilkan ${start+1}–${end} dari ${filtered.length} SKU</div>
    </div>
    <div style="overflow-x:auto"><table>
      <thead><tr>
        <th class="${thc('rank')}"     onclick="tSort('rank')">#</th>
        <th class="${thc('sku')}"      onclick="tSort('sku')">SKU</th>
        <th class="${thc('qty')}"      onclick="tSort('qty')"      style="text-align:right">Qty YTD</th>
        <th class="${thc('rev')}"      onclick="tSort('rev')"      style="text-align:right">Revenue YTD</th>
        <th class="${thc('avail')}"    onclick="tSort('avail')"    style="text-align:right">Avail Stock</th>
        <th class="${thc('avgYtd')}"   onclick="tSort('avgYtd')"   style="text-align:right">Avg Sale YTD</th>
        <th class="${thc('avg5w')}"    onclick="tSort('avg5w')"    style="text-align:right">Avg Sale 5W</th>
        <th class="${thc('wc')}"       onclick="tSort('wc')">Wks Cover</th>
        <th class="${thc('cond')}"     onclick="tSort('cond')">Kondisi</th>
        <th class="${thc('restock')}"  onclick="tSort('restock')"  style="text-align:right">Restock</th>
        <th class="${thc('intake')}"   onclick="tSort('intake')"   style="text-align:right">Intake</th>
        <th class="${thc('forecast')}" onclick="tSort('forecast')" style="text-align:right">Reforcasting</th>
        <th class="${thc('endStock')}" onclick="tSort('endStock')" style="text-align:right">Ending Stock</th>
        <th>Rekomendasi</th>
      </tr></thead>
      <tbody>${rows||'<tr><td colspan="14" style="text-align:center;padding:28px;color:var(--mt)">Tidak ada data yang cocok</td></tr>'}</tbody>
    </table></div>
    ${totPg>1?`<div class="pag">
      <button class="pgb" onclick="goPg(${pg-1})" ${pg===1?'disabled':''}>‹</button>
      ${pgBtns}
      <button class="pgb" onclick="goPg(${pg+1})" ${pg===totPg?'disabled':''}>›</button>
      <span class="pgi">Hal ${pg}/${totPg}</span>
    </div>`:''}
  </div>`;
}

function renderAlert() {
  function grid(items, bg, border, tc) {
    if (!items.length) return '<div style="color:var(--mt);font-size:12px;padding:8px 0">Tidak ada SKU dalam kondisi ini.</div>';
    return `<div class="al-grid">${items.map(d=>`
      <div class="al-item" style="background:${bg};border-color:${border}">
        <div class="al-sku" style="color:${tc}">#${d.rank} ${d.sku}</div>
        <div class="al-rev">${fRp(d.rev)}</div>
        <div class="al-wc" style="color:${tc}">WC: ${d.wc>=9999?'∞':d.wc.toFixed(1)}x &nbsp;·&nbsp; RS: ${d.restock>0?'+'+fN(d.restock)+' unit':'—'}</div>
        <div class="al-rec">${d.rec1||'—'}</div>
      </div>`).join('')}</div>`;
  }

  const R  = ALL.filter(d=>d.cond==='R').sort((a,b)=>a.rank-b.rank);
  const P  = ALL.filter(d=>d.cond==='P').sort((a,b)=>a.rank-b.rank);
  const Mo = ALL.filter(d=>d.cond==='Mo').sort((a,b)=>a.rank-b.rank);
  const I  = ALL.filter(d=>d.cond==='I').sort((a,b)=>a.rank-b.rank);

  document.getElementById('page-alert').innerHTML=`
  <div class="al-card">
    <div class="al-ttl" style="color:var(--cr)">
      🔴 Replenish — Restock Segera
      <span class="al-chip" style="background:var(--cr-bg);color:var(--cr)">${R.length} SKU</span>
    </div>
    <div class="al-sub">
      <strong>Sales:</strong> Jaga demand, pertahankan promo, hindari sinyal stockout. &nbsp;·&nbsp;
      <strong>Purchasing:</strong> Emergency reorder — koordinasi produksi, eskalasi ke Manager/CEO.
    </div>
    ${grid(R,'#FDECEA','#E8A8A8','#B83030')}
  </div>
  <div class="al-card">
    <div class="al-ttl" style="color:var(--cp)">
      🟡 Push — Dorong Penjualan
      <span class="al-chip" style="background:var(--cp-bg);color:var(--cp)">${P.length} SKU</span>
    </div>
    <div class="al-sub">

      <strong>Purchasing:</strong> Tahan intake, tunggu konfirmasi demand sebelum reorder.
    </div>
    ${grid(Mo,'#E8EEF5','#A8BEDD','#466689')}
  </div>
  <div class="al-card">
    <div class="al-ttl" style="color:var(--ci)">
      ⚫ Idle — Review Strategis
      <span class="al-chip" style="background:var(--ci-bg);color:var(--ci)">${I.length} SKU</span>
    </div>
    <div class="al-sub">
      <strong>Sales:</strong> Clearance, reposition, atau discontinue. &nbsp;·&nbsp;
      <strong>Purchasing:</strong> Stop semua PO — keputusan butuh level Manager/CEO.
    </div>
    ${grid(I,'#EEEBE6','#B0A899','#5F5955')}

}

// ═══════════════════════════════════════════════
// INTERACTION
// ═══════════════════════════════════════════════
function showPage(id,btn) {
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('act'));
  document.querySelectorAll('.nb').forEach(b=>b.classList.remove('act'));
  document.getElementById('page-'+id).classList.add('act');
  btn.classList.add('act');
}
function doFilt(f){filt=f;applyFilt();renderSKU();}
function doFiltAndGo(f) {
  filt=f; applyFilt();
  // Pindah ke halaman SKU
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('act'));
  document.querySelectorAll('.nb').forEach(b=>b.classList.remove('act'));
  document.getElementById('page-sku').classList.add('act');
  document.querySelectorAll('.nb')[1].classList.add('act');
  renderSKU();
}
function doSrch(v){srch=v;applyFilt();renderSKU();}
function doSort(col){sCol=col;sDir=col==='rank'||col==='wc'||col==='endStock'?'asc':'desc';applyFilt();renderSKU();}
function tSort(col){
  if(sCol===col) sDir=sDir==='asc'?'desc':'asc';
  else{sCol=col;sDir=col==='rank'||col==='wc'||col==='endStock'?'asc':'desc';}
  applyFilt();renderSKU();
}
function goPg(p){
  const t=Math.ceil(filtered.length/PG);
  if(p<1||p>t) return;
  pg=p;renderSKU();
  window.scrollTo({top:0,behavior:'smooth'});
}

init();
</script>
