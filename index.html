<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Merchandising Intelligence Dashboard</title>
<style>
  :root {
    --green-bold: #264C47;
    --cream-bold: #BA9F87;
    --blue-bold: #466689;
    --cream-soft: #EEDDCA;
    --green-soft: #86AFAA;
    --pink-soft: #fddbd3;
    --white: #FFFFFF;
    --gray-100: #F7F5F2;
    --gray-200: #EDE9E3;
    --gray-400: #B8B0A6;
    --gray-600: #7A7068;
    --gray-800: #3D3830;
    --text-main: #1E2E2B;
    --text-muted: #6B7A78;
    --cond-a: #264C47;
    --cond-a-bg: #E0EDEB;
    --cond-b: #BA7517;
    --cond-b-bg: #FFF0D6;
    --cond-c: #C0392B;
    --cond-c-bg: #FDECEA;
    --cond-d: #5F5E5A;
    --cond-d-bg: #EEEDE9;
    --font-display: 'Georgia', 'Times New Roman', serif;
    --font-body: -apple-system, 'Segoe UI', sans-serif;
    --font-mono: 'SF Mono', 'Fira Code', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--gray-100);
    font-family: var(--font-body);
    color: var(--text-main);
    min-height: 100vh;
  }

  /* ── HEADER ── */
  .header {
    background: var(--green-bold);
    padding: 20px 32px 16px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
  }
  .header-left h1 {
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: normal;
    color: var(--cream-soft);
    letter-spacing: 0.02em;
  }
  .header-left .subtitle {
    font-size: 11px;
    color: var(--green-soft);
    margin-top: 3px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .header-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .last-update {
    font-size: 11px;
    color: var(--green-soft);
    text-align: right;
  }
  .last-update span {
    display: block;
    color: var(--cream-soft);
    font-size: 13px;
    font-family: var(--font-mono);
  }
  .refresh-btn {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    color: var(--cream-soft);
    padding: 7px 14px;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
    transition: background 0.2s;
    letter-spacing: 0.03em;
  }
  .refresh-btn:hover { background: rgba(255,255,255,0.18); }

  /* ── LOADING / ERROR ── */
  .state-overlay {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 80px 20px;
    gap: 16px;
    color: var(--text-muted);
  }
  .spinner {
    width: 36px; height: 36px;
    border: 3px solid var(--gray-200);
    border-top-color: var(--green-bold);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── MAIN LAYOUT ── */
  .main { padding: 24px 32px; max-width: 1400px; margin: 0 auto; }

  /* ── KPI STRIP ── */
  .kpi-strip {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 12px;
    margin-bottom: 24px;
  }
  .kpi-card {
    background: var(--white);
    border-radius: 10px;
    padding: 16px;
    border-top: 3px solid transparent;
  }
  .kpi-card.total { border-top-color: var(--blue-bold); }
  .kpi-card.cond-a { border-top-color: var(--cond-a); }
  .kpi-card.cond-b { border-top-color: var(--cond-b); }
  .kpi-card.cond-c { border-top-color: var(--cond-c); }
  .kpi-card.cond-d { border-top-color: var(--cond-d); }
  .kpi-card.restock { border-top-color: var(--cream-bold); }
  .kpi-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--text-muted);
    margin-bottom: 6px;
  }
  .kpi-value {
    font-size: 26px;
    font-weight: 700;
    color: var(--text-main);
    line-height: 1;
  }
  .kpi-sub {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 4px;
  }

  /* ── CONTROLS BAR ── */
  .controls-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }
  .search-wrap {
    position: relative;
    flex: 1;
    min-width: 200px;
    max-width: 320px;
  }
  .search-wrap input {
    width: 100%;
    padding: 9px 12px 9px 34px;
    border: 1px solid var(--gray-200);
    border-radius: 8px;
    font-size: 13px;
    background: var(--white);
    color: var(--text-main);
    outline: none;
    transition: border-color 0.15s;
  }
  .search-wrap input:focus { border-color: var(--green-soft); }
  .search-icon {
    position: absolute;
    left: 10px; top: 50%;
    transform: translateY(-50%);
    color: var(--gray-400);
    font-size: 14px;
    pointer-events: none;
  }
  .filter-group { display: flex; gap: 6px; flex-wrap: wrap; }
  .filter-btn {
    padding: 7px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    border: 1.5px solid transparent;
    transition: all 0.15s;
    background: var(--white);
    color: var(--text-muted);
    border-color: var(--gray-200);
  }
  .filter-btn:hover { border-color: var(--gray-400); }
  .filter-btn.active-all { background: var(--green-bold); color: var(--white); border-color: var(--green-bold); }
  .filter-btn.active-a { background: var(--cond-a-bg); color: var(--cond-a); border-color: var(--cond-a); }
  .filter-btn.active-b { background: var(--cond-b-bg); color: var(--cond-b); border-color: var(--cond-b); }
  .filter-btn.active-c { background: var(--cond-c-bg); color: var(--cond-c); border-color: var(--cond-c); }
  .filter-btn.active-d { background: var(--cond-d-bg); color: var(--cond-d); border-color: var(--cond-d); }

  .sort-select {
    padding: 8px 12px;
    border: 1px solid var(--gray-200);
    border-radius: 8px;
    font-size: 12px;
    background: var(--white);
    color: var(--text-main);
    cursor: pointer;
    outline: none;
  }

  /* ── TABLE ── */
  .table-wrap {
    background: var(--white);
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid var(--gray-200);
  }
  .table-header-bar {
    padding: 14px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--gray-200);
  }
  .table-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-main);
  }
  .table-count {
    font-size: 12px;
    color: var(--text-muted);
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  thead th {
    padding: 10px 16px;
    text-align: left;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--text-muted);
    background: var(--gray-100);
    border-bottom: 1px solid var(--gray-200);
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }
  thead th:hover { color: var(--text-main); }
  thead th.sort-asc::after { content: " ↑"; }
  thead th.sort-desc::after { content: " ↓"; }
  tbody tr {
    border-bottom: 1px solid var(--gray-200);
    transition: background 0.1s;
  }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: var(--gray-100); }
  td { padding: 11px 16px; vertical-align: middle; }
  td.rank { color: var(--text-muted); font-size: 12px; width: 36px; }
  td.sku-cell { font-weight: 600; color: var(--green-bold); font-size: 13px; }
  td.num { text-align: right; font-family: var(--font-mono); font-size: 12px; }
  td.num.warn { color: var(--cond-c); font-weight: 600; }
  td.num.ok { color: var(--cond-a); }

  /* WC bar */
  .wc-cell { min-width: 120px; }
  .wc-wrap { display: flex; align-items: center; gap: 8px; }
  .wc-num { font-family: var(--font-mono); font-size: 12px; min-width: 38px; text-align: right; }
  .wc-bar-bg { flex: 1; height: 6px; background: var(--gray-200); border-radius: 3px; overflow: hidden; }
  .wc-bar-fill { height: 100%; border-radius: 3px; transition: width 0.4s ease; }

  /* Condition badge */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 9px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.04em;
    white-space: nowrap;
  }
  .badge-dot { width: 6px; height: 6px; border-radius: 50%; }
  .badge-A { background: var(--cond-a-bg); color: var(--cond-a); }
  .badge-A .badge-dot { background: var(--cond-a); }
  .badge-B { background: var(--cond-b-bg); color: var(--cond-b); }
  .badge-B .badge-dot { background: var(--cond-b); }
  .badge-C { background: var(--cond-c-bg); color: var(--cond-c); }
  .badge-C .badge-dot { background: var(--cond-c); }
  .badge-D { background: var(--cond-d-bg); color: var(--cond-d); }
  .badge-D .badge-dot { background: var(--cond-d); }

  /* Restock pill */
  .restock-pill {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 11px;
    font-family: var(--font-mono);
  }
  .restock-pill.needed { background: var(--cond-c-bg); color: var(--cond-c); font-weight: 700; }
  .restock-pill.zero { color: var(--gray-400); }

  /* Recommendation tooltip */
  .rec-cell { max-width: 240px; }
  .rec-sales { font-size: 11px; color: var(--green-bold); margin-bottom: 2px; }
  .rec-purchasing { font-size: 11px; color: var(--blue-bold); }
  .rec-label { font-size: 9px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--gray-400); }

  /* ── BOTTOM CHARTS ── */
  .charts-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-top: 20px;
  }
  .chart-card {
    background: var(--white);
    border-radius: 12px;
    padding: 20px;
    border: 1px solid var(--gray-200);
  }
  .chart-title {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    margin-bottom: 16px;
  }

  /* Donut */
  .donut-wrap { display: flex; align-items: center; gap: 24px; }
  .donut-svg { flex-shrink: 0; }
  .donut-legend { flex: 1; }
  .donut-item { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .donut-dot { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
  .donut-label { font-size: 12px; color: var(--text-main); flex: 1; }
  .donut-pct { font-size: 13px; font-weight: 700; font-family: var(--font-mono); }
  .donut-count { font-size: 11px; color: var(--text-muted); margin-left: 4px; }

  /* Horizontal bar chart */
  .bar-chart { }
  .bar-item { margin-bottom: 12px; }
  .bar-header { display: flex; justify-content: space-between; margin-bottom: 4px; }
  .bar-sku { font-size: 11px; font-weight: 600; color: var(--text-main); }
  .bar-val { font-size: 11px; font-family: var(--font-mono); color: var(--text-muted); }
  .bar-track { height: 8px; background: var(--gray-200); border-radius: 4px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 4px; background: var(--green-bold); transition: width 0.5s ease; }
  .bar-fill.warning { background: var(--cond-c); }

  /* ── FOOTER ── */
  .footer {
    text-align: center;
    padding: 20px;
    font-size: 11px;
    color: var(--gray-400);
    margin-top: 8px;
  }

  /* ── PAGINATION ── */
  .pagination {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 14px;
    border-top: 1px solid var(--gray-200);
  }
  .page-btn {
    padding: 5px 12px;
    border: 1px solid var(--gray-200);
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
    background: var(--white);
    color: var(--text-main);
    transition: all 0.15s;
  }
  .page-btn:hover:not(:disabled) { border-color: var(--green-bold); color: var(--green-bold); }
  .page-btn:disabled { opacity: 0.4; cursor: default; }
  .page-btn.active { background: var(--green-bold); color: var(--white); border-color: var(--green-bold); }
  .page-info { font-size: 12px; color: var(--text-muted); }

  @media (max-width: 900px) {
    .kpi-strip { grid-template-columns: repeat(3, 1fr); }
    .charts-row { grid-template-columns: 1fr; }
    .main { padding: 16px; }
    .header { padding: 16px; }
  }
</style>
</head>
<body>

<header class="header">
  <div class="header-left">
    <h1>Merchandising Intelligence</h1>
    <div class="subtitle">Intake Control System — Real-time Stock &amp; Restock Monitor</div>
  </div>
  <div class="header-right">
    <div class="last-update">
      Data diperbarui<span id="update-time">—</span>
    </div>
    <button class="refresh-btn" onclick="loadData()">↻ Refresh</button>
  </div>
</header>

<div class="main">
  <div id="app-content">
    <div class="state-overlay">
      <div class="spinner"></div>
      <div>Memuat data dari Google Sheets...</div>
    </div>
  </div>
</div>

<div class="footer">
  Merchandising Intelligence Dashboard &nbsp;·&nbsp; Data bersumber dari intake_control_system
</div>

<script>
// ═══════════════════════════════════
// KONFIGURASI
// ═══════════════════════════════════
const SHEET_ID       = '1wqhs70hjgTE13_BXTPflPJGqZ6i7YIj1jQZ3vs-sgAU';
const GID_DASHBOARD  = '1636358761';  // tab dashboard  : rank, SKU, qty, revenue
const GID_INTAKE     = '1043734254';  // tab intake_control: avail, avg26, avg5w, WC, restock

// ── THRESHOLDS ──
const WC_KRITIS      = 2;
const WC_AMAN_MAX    = 12;
const WC_IDLE        = 26;
const AVG26_MIN      = 5;    // avg26 >= nilai ini → demand dianggap ada
const DROP_RATIO     = 0.35; // avg5w < 35% dari avg26 + WC kritis → stockout-driven

// ── STATE ──
let allData = [];
let filtered = [];
let currentFilter = 'ALL';
let searchTerm = '';
let sortCol = 'rank';   // default: urutan revenue rank
let sortDir = 'asc';
let currentPage = 1;
const PAGE_SIZE = 25;

// ── SKU BARANG SETENGAH JADI — dikecualikan dari analisa ──
const EXCLUDED_SKU = new Set([
  'HQJ-NON-ASB','INNER-A4-ALHIFZ-JAKET','INNER-A5-ALHIFZ-HVSWARNA-JAKET',
  'INNER-A5-BUKHARA-KERUT','INR-0001','INR-0002','INR-0006','INR-0007',
  'INR-0009','INR-0010','INR-0011','INR-0012','INR-0015','INR-0016',
  'INR-0018','INR-0019','INR-0020','INR-0021','INR-0022','INR-0023',
  'INR-0027','INR-0035','INR-0036','SISIPAN-D1','SISIPAN-D10','SISIPAN-D5',
  'SISIPAN-D6','SISIPAN-D7','SISIPAN-D8','SISIPAN-D9'
]);

// ═══════════════════════════════════
// LOGIKA KONDISI (revisi final v2)
//
// Sumber data per SKU:
//   qty        : total penjualan YTD (dari tab dashboard) — sinyal demand paling reliable
//   avg5w      : rata-rata penjualan 5 minggu terakhir (dari intake, week terbaru)
//   avg_2026   : sum sale week terbaru (dari intake — sebagai proxy aktivitas terkini)
//   avail      : stok tersedia saat ini (dari intake, week terbaru)
//   wc         : weeks cover (dari intake, week terbaru)
//
// Hierarki kondisi:
//   D (Idle)      : stok ADA, tidak ada penjualan sama sekali sepanjang tahun
//   C (Replenish) : ada riwayat penjualan (demand ada) tapi stok habis atau WC kritis
//   B (Push)      : stok berlebih relatif terhadap kecepatan jual
//   A (Maintain)  : kondisi sehat
// ═══════════════════════════════════
function deriveCondition(row) {
  const { wc, avg5w, avg_2026, avail, qty } = row;

  // Demand ada jika ada riwayat penjualan (qty adalah total YTD — tidak bisa 0 karena stockout)
  const demandAda = qty >= 10;

  // ── D (Idle): stok ada tapi tidak pernah terjual sepanjang tahun ──
  if (avail > 0 && !demandAda) return 'D';

  // ── C (Replenish): demand ada tapi stok tidak cukup ──
  if (demandAda && avail === 0)                          return 'C'; // stockout
  if (demandAda && wc > 0 && wc < WC_KRITIS)            return 'C'; // hampir habis
  if (demandAda && avg5w > 0 && avg_2026 > 0 &&
      (avg5w / avg_2026) < DROP_RATIO && wc <= WC_KRITIS) return 'C'; // drop tajam

  // ── B (Push): stok berlebih ──
  if(wc>WC_IDLE) return 'B';
  if(wc>WC_AMAN) return 'B';

  // ── A (Maintain): sehat ──
  return 'A';
}

function condLabel(c) {
  return {A:'Maintain', B:'Push', C:'Replenish', D:'Idle'}[c] || c;
}

function recSales(c) {
  return {
    A: 'Pertahankan momentum, jaga promo rutin',
    B: 'Boost iklan, flash sale, bundling',
    C: 'Jaga demand; stok kosong, demand tetap ada',
    D: 'Investigasi root cause, pertimbangkan clearance'
  }[c] || '-';
}

function recPurchasing(c) {
  return {
    A: 'Reorder sesuai jadwal, safety stock normal',
    B: 'Tahan PO baru, pantau sell-through',
    C: 'Emergency reorder segera, eskalasi ke manager',
    D: 'Stop semua PO, hitung potensi write-off/retur'
  }[c] || '-';
}

// ═══════════════════════════════════
// PARSE UTILITIES
// ═══════════════════════════════════
function parseID(v) {
  if (v === null || v === undefined || v === '') return 0;
  const s = String(v).replace(/\./g, '').replace(',', '.');
  return parseFloat(s) || 0;
}

function parseCSV(text) {
  const lines = text.trim().split('\n');
  return lines.map(line => {
    const cols = [];
    let cur = '', inQ = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') { inQ = !inQ; }
      else if (ch === ',' && !inQ) { cols.push(cur.trim()); cur = ''; }
      else { cur += ch; }
    }
    cols.push(cur.trim());
    return cols;
  });
}

async function fetchSheet(gid) {
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${gid}`;
  const r = await fetch(url);
  if (!r.ok) throw new Error(`HTTP ${r.status} — GID ${gid}. Pastikan sheet diset publik.`);
  return parseCSV(await r.text());
}

function findHeaderRow(rows, ...keywords) {
  for (let i = 0; i < rows.length; i++) {
    const joined = rows[i].join('|').toLowerCase();
    if (keywords.every(kw => joined.includes(kw.toLowerCase()))) return i;
  }
  return -1;
}

// ═══════════════════════════════════
// LOAD DATA — fetch dua tab, join by SKU
// ═══════════════════════════════════
async function loadData() {
  document.getElementById('app-content').innerHTML = `
    <div class="state-overlay"><div class="spinner"></div><div>Memuat data dari Google Sheets...</div></div>`;

  try {
    // Fetch dua tab secara paralel
    const [dashRows, intakeRows] = await Promise.all([
      fetchSheet(GID_DASHBOARD),
      fetchSheet(GID_INTAKE)
    ]);

    // ── PARSE TAB DASHBOARD: rank, SKU, qty, revenue ──
    const dhi = findHeaderRow(dashRows, 'rank', 'sku');
    if (dhi < 0) throw new Error('Header tidak ditemukan di tab dashboard.');

    const dashMap = {};
    for (let i = dhi + 1; i < dashRows.length; i++) {
      const r = dashRows[i];
      const skuVal = (r[2] || r[1] || '').trim();
      if (!skuVal) continue;
      const rankVal = parseID(r[1]);
      if (!rankVal) continue;
      if (rankVal > 300) continue; // hanya rank 1–300
      dashMap[skuVal.toUpperCase()] = {
        rank      : rankVal,
        sku       : skuVal,
        qty       : parseID(r[3]),
        total_value: parseID(r[4]),
      };
    }

    if (Object.keys(dashMap).length === 0)
      throw new Error('Tidak ada data SKU di tab dashboard (rank 1–300).');

    // ── PARSE TAB INTAKE_CONTROL (format wide/pivot) ──
    //
    // Struktur 2 baris header:
    //   Baris 0 (row header 1): No. | SKU | W23 | start date | end date | W24 | ...
    //                            setiap week-block punya 5 kolom: Avail, SumSale, Avg5Wk, WksCover, Restock
    //   Baris 1 (row header 2): #   | SKU/Product Code | Avail Stock | Sum Sale | Avg Sale 5Wk | Wks Cover | Restock Needed | (ulang)
    //
    // Strategi: baca baris header 1 untuk tahu posisi week-number,
    //           baca baris header 2 untuk tahu posisi sub-kolom,
    //           ambil week terbesar (paling kanan) sebagai data terkini.

    const intakeMap = {};

    // Temukan baris yang mengandung angka week (isoweek) di header baris 1
    // Cirinya: kolom B = "SKU" dan ada kolom berisi angka 1-53
    let weekHeaderRow = -1;
    let dataSubHeaderRow = -1;
    for (let i = 0; i < Math.min(intakeRows.length, 10); i++) {
      const r = intakeRows[i];
      const hasSkuCol = r.some(c => /sku|product code/i.test(c));
      const hasWeekNum = r.some(c => /^\d{1,2}$/.test((c||'').trim()) && parseInt(c) >= 1 && parseInt(c) <= 53);
      if (hasSkuCol && hasWeekNum) { weekHeaderRow = i; break; }
    }

    if (weekHeaderRow >= 0) {
      // Baris sub-header (baris berikutnya: Avail Stock, Sum Sale, dll)
      dataSubHeaderRow = weekHeaderRow + 1;
      const wRow  = intakeRows[weekHeaderRow];
      const sRow  = (dataSubHeaderRow < intakeRows.length) ? intakeRows[dataSubHeaderRow] : [];

      // Temukan kolom SKU (kolom B = index 1)
      let iSku = 1;
      for (let c = 0; c < wRow.length; c++) {
        if (/sku|product code/i.test((wRow[c]||'').trim())) { iSku = c; break; }
      }

      // Kumpulkan semua week-block: { weekNum, startCol }
      // Setiap week-block dimulai dari kolom yang berisi angka isoweek
      const weekBlocks = [];
      for (let c = 0; c < wRow.length; c++) {
        const val = (wRow[c] || '').trim();
        if (/^\d{1,2}$/.test(val)) {
          const wn = parseInt(val);
          if (wn >= 1 && wn <= 53) weekBlocks.push({ weekNum: wn, startCol: c });
        }
      }

      if (weekBlocks.length > 0) {
        // Ambil week terbesar = data terkini
        weekBlocks.sort((a, b) => b.weekNum - a.weekNum);
        const latestBlock = weekBlocks[0];
        const base = latestBlock.startCol;

        // Dalam setiap block: base+0=Avail Stock, base+1=Sum Sale, base+2=Avg Sale 5Wk, base+3=Wks Cover, base+4=Restock Needed
        // Konfirmasi dari sub-header jika ada
        let oAvail=0, oSum=1, oAvg5w=2, oWc=3, oRestock=4;
        if (sRow.length > base + 4) {
          for (let d = 0; d <= 4; d++) {
            const lbl = (sRow[base + d] || '').toLowerCase();
            if (/avail|stock/i.test(lbl))           oAvail   = d;
            else if (/sum.*sale|total.*sale/i.test(lbl)) oSum = d;
            else if (/avg.*5|5.*wk/i.test(lbl))     oAvg5w   = d;
            else if (/wk.*cover|wks.*cover/i.test(lbl)) oWc  = d;
            else if (/restock|needed/i.test(lbl))   oRestock = d;
          }
        }

        // Baca data per SKU mulai dari baris setelah sub-header
        const dataStartRow = dataSubHeaderRow + 1;
        for (let i = dataStartRow; i < intakeRows.length; i++) {
          const r = intakeRows[i];
          const skuRaw = (r[iSku] || '').trim();
          if (!skuRaw || skuRaw === '#') continue;
          intakeMap[skuRaw.toUpperCase()] = {
            avail   : parseID(r[base + oAvail]),
            avg5w   : parseID(r[base + oAvg5w]),
            wc      : parseID(r[base + oWc]),
            restock : parseID(r[base + oRestock]),
            // avg_2026 tidak ada di intake_control — gunakan sum_sale dari week terbaru sebagai proxy
            avg_2026: parseID(r[base + oSum]),
          };
        }
      }
    }

    // ── JOIN dashboard × intake_control by SKU ──
    const parsed = Object.values(dashMap)
      .sort((a, b) => a.rank - b.rank)
      .filter(d => !EXCLUDED_SKU.has(d.sku.toUpperCase()))
      .map(d => {
        const key    = d.sku.toUpperCase();
        const intake = intakeMap[key] || { avail:0, avg5w:0, wc:0, restock:0, avg_2026:0 };
        const obj = {
          rank       : d.rank,
          sku        : d.sku,
          qty        : d.qty,
          total_value: d.total_value,
          avail      : intake.avail,
          avg_2026   : intake.avg_2026,  // sum sale week terbaru dari intake
          avg5w      : intake.avg5w,
          wc         : intake.wc,
          restock    : intake.restock,
        };
        obj.condition      = deriveCondition(obj);
        obj.rec_sales      = recSales(obj.condition);
        obj.rec_purchasing = recPurchasing(obj.condition);
        return obj;
      });

    if (parsed.length === 0)
      throw new Error('Join data gagal — tidak ada SKU yang cocok antara dua tab.');

    allData = parsed;
    document.getElementById('update-time').textContent = new Date().toLocaleString('id-ID', {
      day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit'
    });
    applyFilters();
    renderAll();

  } catch(e) {
    document.getElementById('app-content').innerHTML = `
      <div class="state-overlay">
        <div style="color:#C0392B;font-size:32px;">⚠</div>
        <div style="font-weight:600;color:#3D3830">Gagal memuat data</div>
        <div style="font-size:12px;color:#7A7068;max-width:400px;text-align:center">
          ${e.message}<br><br>
          Pastikan Google Sheets diset ke <strong>"Anyone with the link can view"</strong>,
          kemudian klik Refresh.
        </div>
        <button class="refresh-btn" style="background:var(--green-bold);margin-top:8px" onclick="loadData()">↻ Coba Lagi</button>
      </div>`;
  }
}

function applyFilters() {
  filtered = allData.filter(d => {
    const matchFilter = currentFilter === 'ALL' || d.condition === currentFilter;
    const matchSearch = !searchTerm || d.sku.toLowerCase().includes(searchTerm.toLowerCase());
    return matchFilter && matchSearch;
  });
  filtered.sort((a, b) => {
    const av = a[sortCol], bv = b[sortCol];
    if (typeof av === 'string') return sortDir === 'asc' ? av.localeCompare(bv) : bv.localeCompare(av);
    return sortDir === 'asc' ? av - bv : bv - av;
  });
  currentPage = 1;
}

function fmt(n) {
  if (n === undefined || n === null) return '—';
  if (n >= 1e9) return 'Rp' + (n/1e9).toFixed(1) + 'M';
  if (n >= 1e6) return 'Rp' + (n/1e6).toFixed(1) + 'jt';
  if (n >= 1e3) return n.toLocaleString('id-ID');
  return n.toLocaleString('id-ID');
}

function fmtRp(n) {
  if (!n) return '—';
  if (n >= 1e9) return 'Rp' + (n/1e9).toFixed(2) + ' M';
  if (n >= 1e6) return 'Rp' + (n/1e6).toFixed(1) + ' jt';
  return 'Rp' + n.toLocaleString('id-ID');
}

function wcColor(wc, cond) {
  if (cond === 'C') return '#C0392B';
  if (cond === 'D') return '#B8B0A6';
  if (cond === 'B') return '#E67E22';
  return '#264C47';
}

function wcBarWidth(wc) {
  if (wc === 0) return 0;
  if (wc >= 30) return 100;
  return Math.min(100, (wc / 30) * 100);
}

// ── RENDER ──
function renderAll() {
  const counts = {A:0, B:0, C:0, D:0};
  let totalRestock = 0;
  allData.forEach(d => {
    counts[d.condition]++;
    totalRestock += d.restock || 0;
  });
  const total = allData.length;

  // Donut data
  const donutData = [
    { label: 'A — Maintain', count: counts.A, color: '#264C47', pct: total ? Math.round(counts.A/total*100) : 0 },
    { label: 'B — Push', count: counts.B, color: '#BA7517', pct: total ? Math.round(counts.B/total*100) : 0 },
    { label: 'C — Replenish', count: counts.C, color: '#C0392B', pct: total ? Math.round(counts.C/total*100) : 0 },
    { label: 'D — Idle', count: counts.D, color: '#B8B0A6', pct: total ? Math.round(counts.D/total*100) : 0 },
  ];

  // Top 10 by value for bar chart
  const topSku = [...allData].sort((a,b) => b.total_value - a.total_value).slice(0, 10);
  const maxVal = topSku[0]?.total_value || 1;

  // Critical SKUs
  const criticalSku = allData.filter(d => d.condition === 'C').slice(0, 8);

  // Paginate
  const startIdx = (currentPage - 1) * PAGE_SIZE;
  const pageData = filtered.slice(startIdx, startIdx + PAGE_SIZE);
  const totalPages = Math.ceil(filtered.length / PAGE_SIZE);

  // Table rows
  const tableRows = pageData.map((d, i) => {
    const wc = d.wc;
    const wcW = wcBarWidth(wc);
    const wcCol = wcColor(wc, d.condition);
    const wcDisplay = wc === 0 ? '0.0' : wc === 9999 ? 'N/A' : wc.toFixed(1);
    return `
    <tr>
      <td class="rank">${d.rank}</td>
      <td class="sku-cell">${d.sku}</td>
      <td class="num">${fmt(d.qty)}</td>
      <td class="num">${fmtRp(d.total_value)}</td>
      <td class="num">${fmt(d.avail)}</td>
      <td class="num">${d.avg_2026.toFixed(1)}</td>
      <td class="num">${d.avg5w.toFixed(1)}</td>
      <td class="wc-cell">
        <div class="wc-wrap">
          <div class="wc-num" style="color:${wcCol}">${wcDisplay}x</div>
          <div class="wc-bar-bg">
            <div class="wc-bar-fill" style="width:${wcW}%;background:${wcCol}"></div>
          </div>
        </div>
      </td>
      <td>
        <span class="badge badge-${d.condition}">
          <span class="badge-dot"></span>${d.condition} ${condLabel(d.condition)}
        </span>
      </td>
      <td>
        <span class="restock-pill ${d.restock > 0 ? 'needed' : 'zero'}">
          ${d.restock > 0 ? '+' + fmt(d.restock) : '—'}
        </span>
      </td>
      <td class="rec-cell">
        <div class="rec-label">Sales</div>
        <div class="rec-sales">${d.rec_sales}</div>
        <div class="rec-label" style="margin-top:4px">Purchasing</div>
        <div class="rec-purchasing">${d.rec_purchasing}</div>
      </td>
    </tr>`;
  }).join('');

  // Sort indicators
  const cols = ['rank','sku','qty','total_value','avail','avg_2026','avg5w','wc','condition','restock'];
  const thClass = (c) => c === sortCol ? (sortDir === 'asc' ? 'sort-asc' : 'sort-desc') : '';

  // Pagination
  let pagBtns = '';
  const maxShow = 7;
  let pages = [];
  if (totalPages <= maxShow) {
    for (let i=1;i<=totalPages;i++) pages.push(i);
  } else {
    pages = [1];
    if (currentPage > 3) pages.push('...');
    for (let i=Math.max(2,currentPage-1);i<=Math.min(totalPages-1,currentPage+1);i++) pages.push(i);
    if (currentPage < totalPages-2) pages.push('...');
    pages.push(totalPages);
  }
  pagBtns = pages.map(p => p === '...'
    ? `<span style="color:var(--text-muted);padding:0 4px">…</span>`
    : `<button class="page-btn ${p===currentPage?'active':''}" onclick="goPage(${p})">${p}</button>`
  ).join('');

  // Build donut SVG
  const cx = 70, cy = 70, r = 50, gap = 3;
  let donutPaths = '';
  let cumAngle = -Math.PI / 2;
  const totalCount = donutData.reduce((s,d)=>s+d.count,0) || 1;
  donutData.forEach(seg => {
    const angle = (seg.count / totalCount) * (2 * Math.PI);
    const endAngle = cumAngle + angle - (gap / r);
    const x1 = cx + r * Math.cos(cumAngle), y1 = cy + r * Math.sin(cumAngle);
    const x2 = cx + r * Math.cos(endAngle), y2 = cy + r * Math.sin(endAngle);
    const large = angle > Math.PI ? 1 : 0;
    donutPaths += `<path d="M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2} Z" fill="${seg.color}" opacity="0.85"/>`;
    cumAngle += angle;
  });

  document.getElementById('app-content').innerHTML = `
  <!-- KPI STRIP -->
  <div class="kpi-strip">
    <div class="kpi-card total">
      <div class="kpi-label">Total SKU Aktif</div>
      <div class="kpi-value">${total}</div>
      <div class="kpi-sub">dari 493 SKU terdaftar</div>
    </div>
    <div class="kpi-card cond-a">
      <div class="kpi-label">A — Maintain</div>
      <div class="kpi-value" style="color:var(--cond-a)">${counts.A}</div>
      <div class="kpi-sub">${total ? Math.round(counts.A/total*100) : 0}% portofolio</div>
    </div>
    <div class="kpi-card cond-b">
      <div class="kpi-label">B — Push</div>
      <div class="kpi-value" style="color:var(--cond-b)">${counts.B}</div>
      <div class="kpi-sub">Stok tinggi, sales lambat</div>
    </div>
    <div class="kpi-card cond-c">
      <div class="kpi-label">C — Replenish</div>
      <div class="kpi-value" style="color:var(--cond-c)">${counts.C}</div>
      <div class="kpi-sub">Perlu restock segera</div>
    </div>
    <div class="kpi-card cond-d">
      <div class="kpi-label">D — Idle</div>
      <div class="kpi-value" style="color:var(--cond-d)">${counts.D}</div>
      <div class="kpi-sub">Review &amp; keputusan strategis</div>
    </div>
    <div class="kpi-card restock">
      <div class="kpi-label">Total Restock Needed</div>
      <div class="kpi-value" style="color:var(--cream-bold)">${fmt(totalRestock)}</div>
      <div class="kpi-sub">unit perlu diintake</div>
    </div>
  </div>

  <!-- CONTROLS -->
  <div class="controls-bar">
    <div class="search-wrap">
      <span class="search-icon">⌕</span>
      <input type="text" placeholder="Cari SKU..." value="${searchTerm}"
        oninput="onSearch(this.value)" id="search-input">
    </div>
    <div class="filter-group">
      <button class="filter-btn ${currentFilter==='ALL'?'active-all':''}" onclick="setFilter('ALL')">Semua (${allData.length})</button>
      <button class="filter-btn ${currentFilter==='A'?'active-a':''}" onclick="setFilter('A')">A Maintain (${counts.A})</button>
      <button class="filter-btn ${currentFilter==='B'?'active-b':''}" onclick="setFilter('B')">B Push (${counts.B})</button>
      <button class="filter-btn ${currentFilter==='C'?'active-c':''}" onclick="setFilter('C')">C Replenish (${counts.C})</button>
      <button class="filter-btn ${currentFilter==='D'?'active-d':''}" onclick="setFilter('D')">D Idle (${counts.D})</button>
    </div>
    <select class="sort-select" onchange="onSort(this.value)">
      <option value="rank" ${sortCol==='rank'?'selected':''}>Sort: Revenue Rank ↑</option>
      <option value="total_value" ${sortCol==='total_value'?'selected':''}>Sort: Revenue ↓</option>
      <option value="qty" ${sortCol==='qty'?'selected':''}>Sort: Qty Terjual</option>
      <option value="wc" ${sortCol==='wc'?'selected':''}>Sort: Weeks Cover</option>
      <option value="restock" ${sortCol==='restock'?'selected':''}>Sort: Restock Needed</option>
      <option value="avg5w" ${sortCol==='avg5w'?'selected':''}>Sort: Avg Sale 5W</option>
    </select>
  </div>

  <!-- TABLE -->
  <div class="table-wrap">
    <div class="table-header-bar">
      <div class="table-title">Detail SKU</div>
      <div class="table-count">Menampilkan ${startIdx+1}–${Math.min(startIdx+PAGE_SIZE, filtered.length)} dari ${filtered.length} SKU</div>
    </div>
    <div style="overflow-x:auto">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th class="${thClass('sku')}" onclick="toggleSort('sku')">SKU</th>
          <th class="${thClass('qty')}" onclick="toggleSort('qty')" style="text-align:right">Qty Sold</th>
          <th class="${thClass('total_value')}" onclick="toggleSort('total_value')" style="text-align:right">Revenue</th>
          <th class="${thClass('avail')}" onclick="toggleSort('avail')" style="text-align:right">Avail Stock</th>
          <th class="${thClass('avg_2026')}" onclick="toggleSort('avg_2026')" style="text-align:right">Avg 2026</th>
          <th class="${thClass('avg5w')}" onclick="toggleSort('avg5w')" style="text-align:right">Avg 5W</th>
          <th class="${thClass('wc')}" onclick="toggleSort('wc')">Weeks Cover</th>
          <th class="${thClass('condition')}" onclick="toggleSort('condition')">Kondisi</th>
          <th class="${thClass('restock')}" onclick="toggleSort('restock')">Restock</th>
          <th>Rekomendasi</th>
        </tr>
      </thead>
      <tbody>${tableRows || '<tr><td colspan="11" style="text-align:center;padding:32px;color:var(--text-muted)">Tidak ada data yang cocok</td></tr>'}</tbody>
    </table>
    </div>
    ${totalPages > 1 ? `
    <div class="pagination">
      <button class="page-btn" onclick="goPage(${currentPage-1})" ${currentPage===1?'disabled':''}>‹ Prev</button>
      ${pagBtns}
      <button class="page-btn" onclick="goPage(${currentPage+1})" ${currentPage===totalPages?'disabled':''}>Next ›</button>
      <span class="page-info">Hal. ${currentPage} / ${totalPages}</span>
    </div>` : ''}
  </div>

  <!-- BOTTOM CHARTS -->
  <div class="charts-row">
    <div class="chart-card">
      <div class="chart-title">Distribusi Kondisi Portofolio</div>
      <div class="donut-wrap">
        <svg class="donut-svg" width="140" height="140" viewBox="0 0 140 140">
          <circle cx="70" cy="70" r="50" fill="var(--gray-100)"/>
          ${donutPaths}
          <circle cx="70" cy="70" r="28" fill="var(--white)"/>
          <text x="70" y="67" text-anchor="middle" font-size="18" font-weight="700" fill="var(--green-bold)" font-family="Georgia,serif">${total}</text>
          <text x="70" y="80" text-anchor="middle" font-size="9" fill="var(--text-muted)" font-family="sans-serif">SKU</text>
        </svg>
        <div class="donut-legend">
          ${donutData.map(d=>`
          <div class="donut-item">
            <div class="donut-dot" style="background:${d.color}"></div>
            <div class="donut-label">${d.label}</div>
            <div class="donut-pct" style="color:${d.color}">${d.pct}%</div>
            <div class="donut-count">(${d.count})</div>
          </div>`).join('')}
        </div>
      </div>
    </div>

    <div class="chart-card">
      <div class="chart-title">Top 10 SKU by Revenue</div>
      <div class="bar-chart">
        ${topSku.map(d=>`
        <div class="bar-item">
          <div class="bar-header">
            <span class="bar-sku">${d.sku}</span>
            <span class="bar-val">${fmtRp(d.total_value)}</span>
          </div>
          <div class="bar-track">
            <div class="bar-fill ${d.condition==='C'?'warning':''}" style="width:${Math.round(d.total_value/maxVal*100)}%"></div>
          </div>
        </div>`).join('')}
      </div>
    </div>
  </div>
  `;
}

// ── INTERACTION ──
function setFilter(f) { currentFilter = f; applyFilters(); renderAll(); }
function onSearch(v) { searchTerm = v; applyFilters(); renderAll(); }
function onSort(col) {
  sortCol = col;
  sortDir = (col === 'rank' || col === 'wc') ? 'asc' : 'desc';
  applyFilters(); renderAll();
}
function goPage(p) {
  const totalPages = Math.ceil(filtered.length / PAGE_SIZE);
  if (p < 1 || p > totalPages) return;
  currentPage = p;
  renderAll();
  window.scrollTo({top:0, behavior:'smooth'});
}
function toggleSort(col) {
  if (sortCol === col) sortDir = sortDir === 'asc' ? 'desc' : 'asc';
  else { sortCol = col; sortDir = 'desc'; }
  applyFilters(); renderAll();
}

// ── INIT ──
loadData();
</script>
</body>
</html>
