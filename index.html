<!DOCTYPE html>
<html lang="id">
<head>

<title>Merchandising Intelligence Dashboard</title>
<style>
  :root {
    --green-bold: #264C47;

    --font-display: 'Georgia','Times New Roman',serif;
    --font-body: -apple-system,'Segoe UI',sans-serif;

  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--gray-100);font-family:var(--font-body);color:var(--text-main);min-height:100vh}

  .header{background:var(--green-bold);padding:20px 32px 16px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px}
  .header-left h1{font-family:var(--font-display);font-size:22px;font-weight:normal;color:var(--cream-soft);letter-spacing:.02em}
  .header-left .subtitle{font-size:11px;color:var(--green-soft);margin-top:3px;letter-spacing:.06em;text-transform:uppercase}
  .header-right{display:flex;align-items:center;gap:12px}
  .last-update{font-size:11px;color:var(--green-soft);text-align:right}
  .last-update span{display:block;color:var(--cream-soft);font-size:13px;font-family:var(--font-mono)}
  .refresh-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:var(--cream-soft);padding:7px 14px;border-radius:6px;font-size:12px;cursor:pointer;transition:background .2s;letter-spacing:.03em}

  .state-overlay{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 20px;gap:16px;color:var(--text-muted)}
  .spinner{width:36px;height:36px;border:3px solid var(--gray-200);border-top-color:var(--green-bold);border-radius:50%;animation:spin .8s linear infinite}
  .progress-wrap{width:280px;background:var(--gray-200);border-radius:4px;height:6px;overflow:hidden;margin-top:4px}

  .filter-btn:hover{border-color:var(--gray-400)}

  .filter-btn.active-a{background:var(--cond-a-bg);color:var(--cond-a);border-color:var(--cond-a)}
  .filter-btn.active-b{background:var(--cond-b-bg);color:var(--cond-b);border-color:var(--cond-b)}
  .filter-btn.active-c{background:var(--cond-c-bg);color:var(--cond-c);border-color:var(--cond-c)}
  .filter-btn.active-d{background:var(--cond-d-bg);color:var(--cond-d);border-color:var(--cond-d)}
  .sort-select{padding:8px 12px;border:1px solid var(--gray-200);border-radius:8px;font-size:12px;background:var(--white);color:var(--text-main);cursor:pointer;outline:none}

  .table-wrap{background:var(--white);border-radius:12px;overflow:hidden;border:1px solid var(--gray-200)}

<body>

<header class="header">
  <div class="header-left">
    <h1>Merchandising Intelligence</h1>
    <div class="subtitle">Real-time · Sumber: daily_sale &amp; daily_stock</div>
  </div>
  <div class="header-right">
    <div class="last-update">Data diperbarui<span id="update-time">—</span></div>
    <button class="refresh-btn" onclick="loadData()">↻ Refresh</button>
  </div>
</header>

<div class="main">
  <div id="app-content">
    <div class="state-overlay">
      <div class="spinner"></div>
      <div id="loading-msg">Menginisialisasi...</div>
      <div class="progress-wrap"><div class="progress-bar" id="prog" style="width:0%"></div></div>
    </div>
  </div>
</div>

<div class="footer">
  Merchandising Intelligence Dashboard &nbsp;·&nbsp; Kalkulasi: avg_sale_5wk = total qty 5 minggu terakhir ÷ 5 &nbsp;·&nbsp; WC = avail_stock ÷ avg_sale_5wk
</div>

<script>
// ═══════════════════════════════════════════════════════
// KONFIGURASI
// ═══════════════════════════════════════════════════════
const SHEET_ID    = '1wqhs70hjgTE13_BXTPflPJGqZ6i7YIj1jQZ3vs-sgAU';
const GID_SALE    = '988962963';    // tab daily_sale  : date|month|week|SKU|qty_sold|revenue
const GID_STOCK   = '1075155569';    // tab daily_stock : date|month|week|SKU|available_stock
const GID_DASH    = '1636358761';   // tab dashboard   : rank, SKU, qty_ytd, revenue_ytd

// Thresholds (sesuai intake_control_system)
const WC_KRITIS   = 2;    // WC < 2  → Replenish
const WC_AMAN     = 12;   // WC > 12 → Push
const TOP_N       = 300;  // hanya analisa 300 SKU teratas by revenue

// SKU barang setengah jadi — dikecualikan dari analisa
const EXCLUDED = new Set([
  'HQJ-NON-ASB','INNER-A4-ALHIFZ-JAKET','INNER-A5-ALHIFZ-HVSWARNA-JAKET',
  'INNER-A5-BUKHARA-KERUT','INR-0001','INR-0002','INR-0006','INR-0007',
  'INR-0009','INR-0010','INR-0011','INR-0012','INR-0015','INR-0016',
  'INR-0018','INR-0019','INR-0020','INR-0021','INR-0022','INR-0023',
  'INR-0027','INR-0035','INR-0036','SISIPAN-D1','SISIPAN-D10','SISIPAN-D5',
  'SISIPAN-D6','SISIPAN-D7','SISIPAN-D8','SISIPAN-D9'
]);

// ── STATE ──
let allData = [], filtered = [];
let currentFilter = 'ALL', searchTerm = '';
let sortCol = 'rank', sortDir = 'asc';
let currentPage = 1;
const PAGE_SIZE = 25;

// ═══════════════════════════════════════════════════════
// UTILITIES
// ═══════════════════════════════════════════════════════
function pNum(v) {
  if (v === null || v === undefined || v === '') return 0;
  // Handle Indonesian format: 1.234,56 or plain 1234 or 1234.5
  const s = String(v).trim().replace(/\./g, '').replace(',', '.');
  return parseFloat(s) || 0;
}

function parseCSV(text) {
  const lines = text.trim().split('\n');
  return lines.map(line => {
    const cols = []; let cur = '', inQ = false;
    for (const ch of line) {
      if (ch === '"') { inQ = !inQ; }
      else if (ch === ',' && !inQ) { cols.push(cur.trim()); cur = ''; }
      else cur += ch;
    }
    cols.push(cur.trim());
    return cols;
  });
}

async function fetchCSV(gid, label) {
  setMsg(`Memuat ${label}...`);
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${gid}`;
  const r = await fetch(url);
  if (!r.ok) throw new Error(`Gagal fetch ${label} (HTTP ${r.status}). Pastikan sheet diset publik.`);
  return parseCSV(await r.text());
}

function setMsg(msg, pct) {
  const el = document.getElementById('loading-msg');
  const pb = document.getElementById('prog');
  if (el) el.textContent = msg;
  if (pb && pct !== undefined) pb.style.width = pct + '%';
}

function findHeader(rows, ...kws) {
  for (let i = 0; i < Math.min(rows.length, 30); i++) {
    const j = rows[i].join('|').toLowerCase();
    if (kws.every(k => j.includes(k.toLowerCase()))) return i;
  }
  return -1;
}

// Debug helper: tampilkan 3 baris pertama CSV untuk diagnosa
function debugRows(rows, label) {
  const preview = rows.slice(0, 3).map((r, i) => `Row ${i}: ${r.slice(0,6).join(' | ')}`).join('\n');
  console.log(`[${label}] Preview:\n${preview}`);
  return preview;
}

// ═══════════════════════════════════════════════════════
// KALKULASI — dihitung dari raw daily_sale & daily_stock
//
// Avg Sale 5Wk = total qty terjual dalam 5 minggu penuh
//               terakhir (Mon–Sun) ÷ 5
//               → konsisten dengan intake_control_system
//
// WC           = avail_stock_terbaru ÷ avg_sale_5wk
//
// Restock      = MAX(0, target_stock - avail_stock)
//               target_stock = avg_sale_5wk × WC_AMAN
// ═══════════════════════════════════════════════════════
function getLastNCompleteWeeks(n) {
  // Cari Senin awal dari N minggu penuh ke belakang dari hari ini
  const today = new Date();
  const dow = today.getDay(); // 0=Sun,1=Mon,...
  // Senin minggu ini
  const thisMonday = new Date(today);
  thisMonday.setDate(today.getDate() - ((dow + 6) % 7));
  thisMonday.setHours(0, 0, 0, 0);
  // Senin N minggu lalu
  const startMonday = new Date(thisMonday);
  startMonday.setDate(thisMonday.getDate() - (n * 7));
  // Minggu terakhir (hari sebelum Senin minggu ini)
  const endSunday = new Date(thisMonday);
  endSunday.setDate(thisMonday.getDate() - 1);
  endSunday.setHours(23, 59, 59, 999);
  return { start: startMonday, end: endSunday };
}

function calcMetrics(saleBySku, stockBySku, skuList) {
  const { start: w5Start, end: w5End } = getLastNCompleteWeeks(5);

  const result = {};
  for (const sku of skuList) {
    // ── Total qty YTD (seluruh 2026) ──
    const salesAll = saleBySku[sku] || [];
    const qtyYtd = salesAll.reduce((s, r) => s + r.qty, 0);
    const revYtd = salesAll.reduce((s, r) => s + r.rev, 0);

    // ── Avg Sale 5Wk (5 minggu penuh terakhir) ──
    const sales5w = salesAll.filter(r => r.date >= w5Start && r.date <= w5End);
    const qty5w   = sales5w.reduce((s, r) => s + r.qty, 0);
    const avg5w   = qty5w / 5;

    // ── Avg Sale 2026 (rata-rata per minggu seluruh tahun) ──
    const jan1 = new Date('2026-01-05');
    const weeksElapsed = Math.max(1, Math.floor((w5End - jan1) / (7 * 24 * 3600 * 1000)));
    const avg2026 = qtyYtd / weeksElapsed;

    // ── Idle weeks: berapa minggu penuh berturut-turut tanpa penjualan ──
    // Dihitung mundur dari minggu terbaru. Berhenti saat pertama ada penjualan.
    let idleWeeks = 0;
    const MS_WEEK = 7 * 24 * 3600 * 1000;
    for (let w = 0; w < 26; w++) {
      const wkEnd   = new Date(w5End.getTime() - w * MS_WEEK);
      const wkStart = new Date(wkEnd.getTime() - MS_WEEK + 1);
      const hasQty  = salesAll.some(r => r.date >= wkStart && r.date <= wkEnd && r.qty > 0);
      if (!hasQty) idleWeeks++;
      else break;
    }

    // ── Stok kosong selama 5 pekan terakhir (stockout-driven idle) ──
    const stkAll   = stockBySku[sku] || [];
    const stkIn5w  = stkAll.filter(r => r.date >= w5Start && r.date <= w5End);
    const stockout5w = stkIn5w.length > 0 && stkIn5w.every(r => r.stock === 0);

    // ── Avail Stock (snapshot terbaru) ──
    let avail = 0;
    if (stkAll.length > 0) {
      stkAll.sort((a, b) => b.date - a.date);
      avail = stkAll[0].stock;
    }

    // ── Weeks Cover ──
    const wc = avg5w > 0 ? avail / avg5w : (avail > 0 ? 9999 : 0);

    // ── Restock Needed ──
    const targetStock = avg5w * WC_AMAN;
    const restock = avg5w > 0 ? Math.max(0, Math.ceil(targetStock - avail)) : 0;

    result[sku] = { qtyYtd, revYtd, avg5w, avg2026, avail, wc, restock, idleWeeks, stockout5w };
  }
  return result;
}

// ═══════════════════════════════════════════════════════
// LOGIKA KONDISI (final)
//
// D (Idle)      : stok ADA + tidak ada penjualan ≥5 pekan berturut-turut
//                 + bukan karena stockout (demand benar-benar tidak ada)
//                 + SKU bukan prefix acc- atau daftar exclude lainnya
//
// C (Replenish) : pernah ada penjualan tahun ini TAPI:
//                 - stok kosong sekarang, ATAU
//                 - idle 5w tapi disebabkan stockout (stok kosong di 5w tsb), ATAU
//                 - WC kritis (< 2), ATAU
//                 - avg5w drop tajam vs avg2026 + WC kritis
//
// B (Push)      : WC > 12 → stok berlebih vs kecepatan jual
// A (Maintain)  : kondisi sehat
// ═══════════════════════════════════════════════════════
function isExcludedFromIdle(sku) {
  const u = sku.toUpperCase();
  // Prefix acc- = barang setengah jadi aksesoris
  if (u.startsWith('ACC-')) return true;
  // Daftar exclude spesifik
  return EXCLUDED.has(u);
}

function deriveCondition(m, sku) {
  const { avg5w, avg2026, avail, wc, qtyYtd, idleWeeks, stockout5w } = m;
  const pernahTerjual = qtyYtd >= 10; // ada riwayat penjualan di 2026

  // ── C: demand ada tapi stok tidak cukup ──
  if (pernahTerjual) {
    // Stok kosong sekarang
    if (avail === 0) return 'C';
    // Idle 5 pekan tapi karena stockout → demand masih ada, bukan idle
    if (idleWeeks >= 5 && stockout5w) return 'C';
    // WC sangat kritis
    if (wc > 0 && wc < WC_KRITIS) return 'C';
    // Drop tajam avg5w vs avg2026 + WC kritis → stockout-driven
    if (avg5w > 0 && avg2026 > 0 && (avg5w / avg2026) < 0.3 && wc <= WC_KRITIS) return 'C';
  }

  // ── D: stok ada, idle ≥5 pekan, demand tidak ada ──
  // Bukan karena stockout, bukan SKU exclude
  if (avail > 0 && idleWeeks >= 5 && !stockout5w && !isExcludedFromIdle(sku)) return 'D';
  // Tidak pernah terjual sama sekali sepanjang 2026 + stok ada
  if (avail > 0 && !pernahTerjual && !isExcludedFromIdle(sku)) return 'D';

  // ── B: stok berlebih ──
  if (avg5w > 0 && wc > WC_AMAN) return 'B';

  // ── A: sehat ──
  return 'A';
}

const COND_LABEL = { A:'Maintain', B:'Push', C:'Replenish', D:'Idle' };
const REC_SALES = {
  A: 'Pertahankan momentum, jaga promo rutin',
  B: 'Boost iklan, flash sale, atau bundling',
  C: 'Jaga demand; stok kosong — demand tetap ada',
  D: 'Investigasi root cause, pertimbangkan clearance'
};
const REC_PURCH = {
  A: 'Reorder sesuai jadwal, safety stock normal',
  B: 'Tahan PO baru, pantau sell-through dulu',
  C: 'Emergency reorder segera, eskalasi ke manager',
  D: 'Stop semua PO, hitung potensi write-off/retur'
};

// ═══════════════════════════════════════════════════════
// LOAD DATA
// ═══════════════════════════════════════════════════════
async function loadData() {
  document.getElementById('app-content').innerHTML = `
    <div class="state-overlay">
      <div class="spinner"></div>
      <div id="loading-msg">Memuat data...</div>
      <div class="progress-wrap"><div class="progress-bar" id="prog" style="width:5%"></div></div>
    </div>`;

  try {
    // Hitung rank langsung dari daily_sale — tidak perlu tab dashboard
    setMsg('Memuat data penjualan harian...', 20);
    const saleRows = await fetchCSV(GID_SALE, 'daily_sale');
    setMsg('Memuat data stok harian...', 70);
    const stockRows = await fetchCSV(GID_STOCK, 'daily_stock');

    // ── Rank dihitung dari revenue YTD daily_sale (lihat blok di bawah) ──

    // ── Parse daily_sale ──
    const shi = findHeader(saleRows, 'date', 'sku');
    if (shi < 0) {
      const dbg = debugRows(saleRows, 'daily_sale');
      throw new Error('Header tidak ditemukan di tab daily_sale. Baris pertama: ' + (saleRows[0]||[]).slice(0,5).join(' | '));
    }
    const shdr = saleRows[shi].map(c => c.toLowerCase().trim());
    const sDate = shdr.findIndex(c => c === 'date');
    const sSku  = shdr.findIndex(c => c === 'sku');
    const sQty  = shdr.findIndex(c => /qty/.test(c));
    const sRev  = shdr.findIndex(c => /revenue|rev/.test(c));

    const saleBySku = {};
    for (let i = shi + 1; i < saleRows.length; i++) {
      const r = saleRows[i];
      const sku = (r[sSku >= 0 ? sSku : 3] || '').trim();
      if (!sku) continue;
      const dateStr = r[sDate >= 0 ? sDate : 0] || '';
      const qty = pNum(r[sQty >= 0 ? sQty : 4]);
      const rev = pNum(r[sRev >= 0 ? sRev : 5]);
      const dt  = new Date(dateStr);
      if (isNaN(dt.getTime())) continue;
      if (!saleBySku[sku]) saleBySku[sku] = [];
      saleBySku[sku].push({ date: dt, qty, rev });
    }

    // ── Hitung rank per SKU berdasarkan total revenue YTD ──
    // Exclude SKU barang setengah jadi
    const revBySku = {};
    for (const [sku, rows] of Object.entries(saleBySku)) {
      const skuU = sku.toUpperCase();
      if (EXCLUDED.has(skuU)) continue;
      if (skuU.startsWith('ACC-')) continue;
      revBySku[sku] = rows.reduce((s, r) => s + r.rev, 0);
    }
    // Urutkan by revenue descending → beri rank
    const rankMap = {};
    Object.entries(revBySku)
      .sort((a, b) => b[1] - a[1])
      .slice(0, TOP_N)
      .forEach(([sku, rev], idx) => {
        rankMap[sku] = idx + 1; // rank mulai dari 1
      });

    if (Object.keys(rankMap).length === 0)
      throw new Error('Tidak ada data penjualan di tab daily_sale. Pastikan sheet sudah publik dan ada data 2026.');

    setMsg('Memuat data stok harian...', 65);

    // ── Parse daily_stock ──
    const sthi = findHeader(stockRows, 'date', 'sku');
    if (sthi < 0) {
      const dbg = debugRows(stockRows, 'daily_stock');
      throw new Error('Header tidak ditemukan di tab daily_stock. Baris pertama: ' + (stockRows[0]||[]).slice(0,5).join(' | '));
    }
    const sthdr = stockRows[sthi].map(c => c.toLowerCase().trim());
    const stDate  = sthdr.findIndex(c => c === 'date');
    const stSku   = sthdr.findIndex(c => c === 'sku');
    const stStock = sthdr.findIndex(c => /avail|stock/.test(c));

    const stockBySku = {};
    for (let i = sthi + 1; i < stockRows.length; i++) {
      const r = stockRows[i];
      const sku = (r[stSku >= 0 ? stSku : 3] || '').trim();
      if (!sku) continue;
      const dateStr = r[stDate >= 0 ? stDate : 0] || '';
      const stock = pNum(r[stStock >= 0 ? stStock : 4]);
      const dt = new Date(dateStr);
      if (isNaN(dt.getTime())) continue;
      if (!stockBySku[sku]) stockBySku[sku] = [];
      stockBySku[sku].push({ date: dt, stock });
    }

    // ── Hitung metrics per SKU ──
    setMsg('Menghitung WC, avg5w, restock...', 88);
    const skuList = Object.keys(rankMap);
    const metrics = calcMetrics(saleBySku, stockBySku, skuList);

    // ── Gabungkan semua ──
    const parsed = skuList
      .sort((a, b) => rankMap[a] - rankMap[b])
      .map(sku => {
        const m = metrics[sku];
        const cond = deriveCondition(m, sku);
        return {
          rank       : rankMap[sku],
          sku        : sku,
          qty        : m.qtyYtd,
          total_value: m.revYtd,
          avail      : m.avail,
          avg_2026   : m.avg2026,
          avg5w      : m.avg5w,
          wc         : m.wc,
          restock    : m.restock,
          condition  : cond,
          rec_sales  : REC_SALES[cond],
          rec_purchasing: REC_PURCH[cond],
        };
      });

    setMsg('Merender dashboard...', 97);
    allData = parsed;
    document.getElementById('update-time').textContent =
      new Date().toLocaleString('id-ID', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
    applyFilters();
    renderAll();

  } catch(e) {
    document.getElementById('app-content').innerHTML = `
      <div class="state-overlay">
        <div style="color:#C0392B;font-size:32px">⚠</div>
        <div style="font-weight:600;color:#3D3830">Gagal memuat data</div>
        <div style="font-size:12px;color:#7A7068;max-width:440px;text-align:center">
          ${e.message}<br><br>
          Pastikan Google Sheets diset ke <strong>"Anyone with the link can view"</strong>
          dan ketiga tab (dashboard, daily_sale, daily_stock) bisa diakses.
        </div>
        <button class="refresh-btn" style="background:var(--green-bold);margin-top:8px" onclick="loadData()">↻ Coba Lagi</button>
      </div>`;
  }
}

// ═══════════════════════════════════════════════════════
// FILTER & SORT
// ═══════════════════════════════════════════════════════
function applyFilters() {
  filtered = allData.filter(d => {
    const mF = currentFilter === 'ALL' || d.condition === currentFilter;
    const mS = !searchTerm || d.sku.toLowerCase().includes(searchTerm.toLowerCase());
    return mF && mS;
  });
  filtered.sort((a, b) => {
    const av = a[sortCol], bv = b[sortCol];
    if (typeof av === 'string') return sortDir === 'asc' ? av.localeCompare(bv) : bv.localeCompare(av);
    return sortDir === 'asc' ? av - bv : bv - av;
  });
  currentPage = 1;
}

// ═══════════════════════════════════════════════════════
// FORMAT
// ═══════════════════════════════════════════════════════
function fmt(n) {
  if (n === undefined || n === null) return '—';
  return Math.round(n).toLocaleString('id-ID');
}
function fmtRp(n) {
  if (!n) return '—';
  if (n >= 1e9) return 'Rp' + (n/1e9).toFixed(2) + ' M';
  if (n >= 1e6) return 'Rp' + (n/1e6).toFixed(1) + ' jt';
  return 'Rp' + Math.round(n).toLocaleString('id-ID');
}
function wcColor(cond) {
  return { A:'#264C47', B:'#E67E22', C:'#C0392B', D:'#B8B0A6' }[cond] || '#888';
}
function wcBarWidth(wc) {
  if (!wc || wc >= 9999) return wc >= 9999 ? 100 : 0;
  return Math.min(100, (wc / 30) * 100);
}

// ═══════════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════════
function renderAll() {
  const counts = { A:0, B:0, C:0, D:0 };
  let totalRestock = 0;
  allData.forEach(d => { counts[d.condition]++; totalRestock += d.restock || 0; });
  const total = allData.length;

  const donutData = [
    { label:'A — Maintain',  count:counts.A, color:'#264C47', pct: total ? Math.round(counts.A/total*100) : 0 },
    { label:'B — Push',      count:counts.B, color:'#BA7517', pct: total ? Math.round(counts.B/total*100) : 0 },
    { label:'C — Replenish', count:counts.C, color:'#C0392B', pct: total ? Math.round(counts.C/total*100) : 0 },
    { label:'D — Idle',      count:counts.D, color:'#B8B0A6', pct: total ? Math.round(counts.D/total*100) : 0 },
  ];

  const topSku = [...allData].sort((a,b) => b.total_value - a.total_value).slice(0,10);
  const maxVal = topSku[0]?.total_value || 1;

  const startIdx = (currentPage - 1) * PAGE_SIZE;
  const pageData = filtered.slice(startIdx, startIdx + PAGE_SIZE);
  const totalPages = Math.ceil(filtered.length / PAGE_SIZE);

  const thClass = c => c === sortCol ? (sortDir === 'asc' ? 'sort-asc' : 'sort-desc') : '';

  const tableRows = pageData.map(d => {
    const wcVal = d.wc >= 9999 ? '∞' : d.wc === 0 ? '0.0' : d.wc.toFixed(1);
    const wcW   = wcBarWidth(d.wc);
    const wcCol = wcColor(d.condition);
    return `<tr>
      <td class="rank">${d.rank}</td>
      <td class="sku-cell">${d.sku}</td>
      <td class="num">${fmt(d.qty)}</td>
      <td class="num">${fmtRp(d.total_value)}</td>
      <td class="num">${fmt(d.avail)}</td>
      <td class="num">${d.avg_2026.toFixed(1)}</td>
      <td class="num">${d.avg5w.toFixed(1)}</td>
      <td class="wc-cell">
        <div class="wc-wrap">
          <div class="wc-num" style="color:${wcCol}">${wcVal}x</div>
          <div class="wc-bar-bg"><div class="wc-bar-fill" style="width:${wcW}%;background:${wcCol}"></div></div>
        </div>
      </td>
      <td><span class="badge badge-${d.condition}"><span class="badge-dot"></span>${d.condition} ${COND_LABEL[d.condition]}</span></td>
      <td><span class="restock-pill ${d.restock > 0 ? 'needed' : 'zero'}">${d.restock > 0 ? '+'+fmt(d.restock) : '—'}</span></td>
      <td class="rec-cell">
        <div class="rec-label">Sales</div><div class="rec-sales">${d.rec_sales}</div>
        <div class="rec-label" style="margin-top:4px">Purchasing</div><div class="rec-purchasing">${d.rec_purchasing}</div>
      </td>
    </tr>`;
  }).join('');

  // Pagination
  let pagBtns = '', pages = [];
  if (totalPages <= 7) { for (let i=1;i<=totalPages;i++) pages.push(i); }
  else {
    pages = [1];
    if (currentPage > 3) pages.push('...');
    for (let i=Math.max(2,currentPage-1);i<=Math.min(totalPages-1,currentPage+1);i++) pages.push(i);
    if (currentPage < totalPages-2) pages.push('...');
    pages.push(totalPages);
  }
  pagBtns = pages.map(p => p === '...'
    ? `<span style="color:var(--text-muted);padding:0 4px">…</span>`
    : `<button class="page-btn ${p===currentPage?'active':''}" onclick="goPage(${p})">${p}</button>`
  ).join('');

  // Donut SVG
  const cx=70, cy=70, r=50, gap=3;
  let donutPaths = '', cumAngle = -Math.PI/2;
  const totalCount = donutData.reduce((s,d)=>s+d.count,0) || 1;
  donutData.forEach(seg => {
    const angle = (seg.count / totalCount) * 2 * Math.PI;
    const endAngle = cumAngle + angle - (gap/r);
    const x1=cx+r*Math.cos(cumAngle), y1=cy+r*Math.sin(cumAngle);
    const x2=cx+r*Math.cos(endAngle), y2=cy+r*Math.sin(endAngle);
    donutPaths += `<path d="M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${angle>Math.PI?1:0} 1 ${x2} ${y2} Z" fill="${seg.color}" opacity="0.85"/>`;
    cumAngle += angle;
  });

  document.getElementById('app-content').innerHTML = `
  <div class="kpi-strip">
    <div class="kpi-card total">
      <div class="kpi-label">Total SKU Aktif</div>
      <div class="kpi-value">${total}</div>
      <div class="kpi-sub">Top ${TOP_N} by revenue</div>
    </div>
    <div class="kpi-card cond-a">
      <div class="kpi-label">A — Maintain</div>
      <div class="kpi-value" style="color:var(--cond-a)">${counts.A}</div>
      <div class="kpi-sub">${total?Math.round(counts.A/total*100):0}% portofolio</div>
    </div>
    <div class="kpi-card cond-b">
      <div class="kpi-label">B — Push</div>
      <div class="kpi-value" style="color:var(--cond-b)">${counts.B}</div>
      <div class="kpi-sub">Stok tinggi, sales lambat</div>
    </div>
    <div class="kpi-card cond-c">
      <div class="kpi-label">C — Replenish</div>
      <div class="kpi-value" style="color:var(--cond-c)">${counts.C}</div>
      <div class="kpi-sub">Perlu restock segera</div>
    </div>
    <div class="kpi-card cond-d">
      <div class="kpi-label">D — Idle</div>
      <div class="kpi-value" style="color:var(--cond-d)">${counts.D}</div>
      <div class="kpi-sub">Stok ada, demand tidak ada</div>
    </div>
    <div class="kpi-card restock">
      <div class="kpi-label">Total Restock Needed</div>
      <div class="kpi-value" style="color:var(--cream-bold)">${fmt(totalRestock)}</div>
      <div class="kpi-sub">unit perlu diintake</div>
    </div>
  </div>

  <div class="controls-bar">
    <div class="search-wrap">
      <span class="search-icon">⌕</span>
      <input type="text" placeholder="Cari SKU..." value="${searchTerm}" oninput="onSearch(this.value)">
    </div>
    <div class="filter-group">
      <button class="filter-btn ${currentFilter==='ALL'?'active-all':''}" onclick="setFilter('ALL')">Semua (${allData.length})</button>
      <button class="filter-btn ${currentFilter==='A'?'active-a':''}" onclick="setFilter('A')">A Maintain (${counts.A})</button>
      <button class="filter-btn ${currentFilter==='B'?'active-b':''}" onclick="setFilter('B')">B Push (${counts.B})</button>
      <button class="filter-btn ${currentFilter==='C'?'active-c':''}" onclick="setFilter('C')">C Replenish (${counts.C})</button>
      <button class="filter-btn ${currentFilter==='D'?'active-d':''}" onclick="setFilter('D')">D Idle (${counts.D})</button>
    </div>
    <select class="sort-select" onchange="onSort(this.value)">
      <option value="rank"        ${sortCol==='rank'       ?'selected':''}>Sort: Revenue Rank ↑</option>
      <option value="total_value" ${sortCol==='total_value'?'selected':''}>Sort: Revenue ↓</option>
      <option value="wc"          ${sortCol==='wc'         ?'selected':''}>Sort: Weeks Cover ↑</option>
      <option value="restock"     ${sortCol==='restock'    ?'selected':''}>Sort: Restock Needed ↓</option>
      <option value="avg5w"       ${sortCol==='avg5w'      ?'selected':''}>Sort: Avg 5W ↓</option>
    </select>
  </div>

  <div class="table-wrap">
    <div class="table-header-bar">
      <div class="table-title">Detail SKU — ${currentFilter==='ALL'?'Semua Kondisi':'Kondisi '+currentFilter+' '+COND_LABEL[currentFilter]}</div>
      <div class="table-count">Menampilkan ${startIdx+1}–${Math.min(startIdx+PAGE_SIZE,filtered.length)} dari ${filtered.length} SKU</div>
    </div>
    <div style="overflow-x:auto">
    <table>
      <thead><tr>
        <th class="${thClass('rank')}"        onclick="toggleSort('rank')">#</th>
        <th class="${thClass('sku')}"         onclick="toggleSort('sku')">SKU</th>
        <th class="${thClass('qty')}"         onclick="toggleSort('qty')"  style="text-align:right">Qty YTD</th>
        <th class="${thClass('total_value')}" onclick="toggleSort('total_value')" style="text-align:right">Revenue YTD</th>
        <th class="${thClass('avail')}"       onclick="toggleSort('avail')" style="text-align:right">Avail Stock</th>
        <th class="${thClass('avg_2026')}"    onclick="toggleSort('avg_2026')" style="text-align:right">Avg/Wk 2026</th>
        <th class="${thClass('avg5w')}"       onclick="toggleSort('avg5w')" style="text-align:right">Avg 5W</th>
        <th class="${thClass('wc')}"          onclick="toggleSort('wc')">Weeks Cover</th>
        <th class="${thClass('condition')}"   onclick="toggleSort('condition')">Kondisi</th>
        <th class="${thClass('restock')}"     onclick="toggleSort('restock')">Restock</th>
        <th>Rekomendasi</th>
      </tr></thead>
      <tbody>${tableRows || '<tr><td colspan="11" style="text-align:center;padding:32px;color:var(--text-muted)">Tidak ada data yang cocok</td></tr>'}</tbody>
    </table>
    </div>
    ${totalPages > 1 ? `
    <div class="pagination">
      <button class="page-btn" onclick="goPage(${currentPage-1})" ${currentPage===1?'disabled':''}>‹ Prev</button>
      ${pagBtns}
      <button class="page-btn" onclick="goPage(${currentPage+1})" ${currentPage===totalPages?'disabled':''}>Next ›</button>
      <span class="page-info">Hal. ${currentPage} / ${totalPages}</span>
    </div>` : ''}
  </div>

  <div class="charts-row">
    <div class="chart-card">
      <div class="chart-title">Distribusi Kondisi Portofolio</div>
      <div class="donut-wrap">
        <svg class="donut-svg" width="140" height="140" viewBox="0 0 140 140">
          <circle cx="70" cy="70" r="50" fill="var(--gray-100)"/>
          ${donutPaths}
          <circle cx="70" cy="70" r="28" fill="var(--white)"/>
          <text x="70" y="67" text-anchor="middle" font-size="18" font-weight="700" fill="var(--green-bold)" font-family="Georgia,serif">${total}</text>
          <text x="70" y="80" text-anchor="middle" font-size="9" fill="var(--text-muted)" font-family="sans-serif">SKU</text>
        </svg>
        <div class="donut-legend">
          ${donutData.map(d=>`
          <div class="donut-item">
            <div class="donut-dot" style="background:${d.color}"></div>
            <div class="donut-label">${d.label}</div>
            <div class="donut-pct" style="color:${d.color}">${d.pct}%</div>
            <div class="donut-count">(${d.count})</div>
          </div>`).join('')}
        </div>
      </div>
    </div>
    <div class="chart-card">
      <div class="chart-title">Top 10 SKU by Revenue</div>
      ${topSku.map(d=>`
      <div class="bar-item">
        <div class="bar-header">
          <span class="bar-sku">#${d.rank} ${d.sku}</span>
          <span class="bar-val">${fmtRp(d.total_value)}</span>
        </div>
        <div class="bar-track">
          <div class="bar-fill ${d.condition==='C'?'warning':''}" style="width:${Math.round(d.total_value/maxVal*100)}%"></div>
        </div>
      </div>`).join('')}
    </div>
  </div>`;
}

// ═══════════════════════════════════════════════════════
// INTERACTION
// ═══════════════════════════════════════════════════════
function setFilter(f) { currentFilter = f; applyFilters(); renderAll(); }
function onSearch(v) { searchTerm = v; applyFilters(); renderAll(); }
function onSort(col) {
  sortCol = col;
  sortDir = (col === 'rank' || col === 'wc') ? 'asc' : 'desc';
  applyFilters(); renderAll();
}
function goPage(p) {
  const t = Math.ceil(filtered.length / PAGE_SIZE);
  if (p < 1 || p > t) return;
  currentPage = p;
  renderAll();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function toggleSort(col) {
  if (sortCol === col) sortDir = sortDir === 'asc' ? 'desc' : 'asc';
  else { sortCol = col; sortDir = col === 'rank' || col === 'wc' ? 'asc' : 'desc'; }
  applyFilters(); renderAll();
}

// ── INIT ──
loadData();
</script>
</body>
</html>
