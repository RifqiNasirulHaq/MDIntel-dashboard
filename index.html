<style>

.pag{display:flex;align-items:center;justify-content:center;gap:5px;padding:11px;border-top:1px solid var(--g2)}

<body>

<header class="hdr">
  <div>
    <h1>Merchandising Intelligence — WSSI</h1>
    <div class="sub">Weekly Sales &amp; Stock Intelligence · daily_sale · daily_stock · intake_plan</div>
  </div>
  <div class="hdr-r">
    <div class="live"><span class="dot"></span>Live</div>
    <div class="upd">Diperbarui<span id="ts">—</span></div>
    <button class="rfbtn" onclick="init()">↻ Refresh</button>
  </div>
</header>

<nav class="nav">
  <button class="nb act" onclick="showPage('overview',this)">Overview</button>
  <button class="nb" onclick="showPage('sku',this)">Detail SKU</button>
  <button class="nb" onclick="showPage('wssi',this)">WSSI Forward</button>
  <button class="nb" onclick="showPage('alert',this)">🔴 Alert &amp; Aksi</button>
</nav>

<div class="main">
  <div class="page act" id="page-overview"><div class="st"><div class="spin"></div><div id="lmsg">Memuat data...</div><div class="pw"><div class="pb" id="prog" style="width:5%"></div></div></div></div>
  <div class="page" id="page-sku"><div class="st"><div class="spin"></div></div></div>
  <div class="page" id="page-wssi"><div class="st"><div class="spin"></div></div></div>
  <div class="page" id="page-alert"><div class="st"><div class="spin"></div></div></div>
</div>

<div class="footer">WSSI Merchandising Dashboard · Sumber: daily_sale · daily_stock · intake_plan · Kalkulasi real-time di browser</div>

<script>
// ═══════════════════════════════════════════════
// KONFIGURASI
// ═══════════════════════════════════════════════
const SHEET_ID   = '1wqhs70hjgTE13_BXTPflPJGqZ6i7YIj1jQZ3vs-sgAU';
const GID_SALE   = '988962963';   // daily_sale:  date|month|week|SKU|qty_sold|revenue
const GID_STOCK  = '1075155569';  // daily_stock: date|month|week|SKU|available_stock
const GID_INTAKE = '674420835';   // intake_plan: week|SKU|qty_intake

const WC_KRITIS  = 2;
const WC_AMAN    = 12;
const TOP_N      = 300;
const UPLIFT_TWIN_DEFAULT  = 2.0;
const UPLIFT_PAYDAY_DEFAULT= 1.3;

const EXCLUDED = new Set([
  'HQJ-NON-ASB','INNER-A4-ALHIFZ-JAKET','INNER-A5-ALHIFZ-HVSWARNA-JAKET',
  'INNER-A5-BUKHARA-KERUT','INR-0001','INR-0002','INR-0006','INR-0007',
  'INR-0009','INR-0010','INR-0011','INR-0012','INR-0015','INR-0016',
  'INR-0018','INR-0019','INR-0020','INR-0021','INR-0022','INR-0023',
  'INR-0027','INR-0035','INR-0036','SISIPAN-D1','SISIPAN-D10','SISIPAN-D5',
  'SISIPAN-D6','SISIPAN-D7','SISIPAN-D8','SISIPAN-D9'
]);

function isExcluded(sku) {
  const u = sku.toUpperCase();
  return EXCLUDED.has(u) || u.startsWith('ACC-');
}

// ── STATE ──
let ALL=[], filtered=[];
let filt='ALL', srch='', sCol='rank', sDir='asc', pg=1;
const PG=25;

// ═══════════════════════════════════════════════
// UTILITIES
// ═══════════════════════════════════════════════
function pNum(v) {
  if (!v && v !== 0) return 0;
  return parseFloat(String(v).trim().replace(/\./g,'').replace(',','.')) || 0;
}

function parseCSV(text) {
  return text.trim().split('\n').map(line => {
    const cols=[]; let cur='', inQ=false;
    for (const ch of line) {
      if (ch==='"'){inQ=!inQ}
      else if (ch===','&&!inQ){cols.push(cur.trim());cur='';}
      else cur+=ch;
    }
    cols.push(cur.trim());
    return cols;
  });
}

async function fetchCSV(gid, label) {
  setMsg(`Memuat ${label}...`);
  const r = await fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${gid}`);
  if (!r.ok) throw new Error(`Gagal fetch ${label} (HTTP ${r.status})`);
  return parseCSV(await r.text());
}

function setMsg(m, p) {
  const e=document.getElementById('lmsg'), b=document.getElementById('prog');
  if(e) e.textContent=m;
  if(b&&p!==undefined) b.style.width=p+'%';
}

function isoWeek(dt) {
  const d=new Date(Date.UTC(dt.getFullYear(),dt.getMonth(),dt.getDate()));
  d.setUTCDate(d.getUTCDate()+4-(d.getUTCDay()||7));
  return Math.ceil((((d-new Date(Date.UTC(d.getUTCFullYear(),0,1)))/86400000)+1)/7);
}

function getMondayOfWeek(weekNum, year=2026) {
  const jan4 = new Date(year, 0, 4);
  const startMonday = new Date(jan4);
  startMonday.setDate(jan4.getDate() - ((jan4.getDay()+6)%7));
  const d = new Date(startMonday);
  d.setDate(startMonday.getDate() + (weekNum-1)*7);
  return d;
}

function get5WkWindow() {
  const today=new Date();
  const dow=today.getDay();
  const thisMonday=new Date(today);
  thisMonday.setDate(today.getDate()-((dow+6)%7));
  thisMonday.setHours(0,0,0,0);
  const endSun=new Date(thisMonday);
  endSun.setDate(thisMonday.getDate()-1);
  endSun.setHours(23,59,59,999);
  const startMon=new Date(endSun);
  startMon.setDate(endSun.getDate()-34);
  startMon.setHours(0,0,0,0);
  return {start:startMon, end:endSun, thisMonday};
}

function getCurrentWeekRange() {
  const {thisMonday}=get5WkWindow();
  const sun=new Date(thisMonday);
  sun.setDate(thisMonday.getDate()+6);
  sun.setHours(23,59,59,999);
  return {start:thisMonday, end:sun, weekNum:isoWeek(thisMonday)};
}

// Twin dates di 2026: 1/1, 2/2, 3/3, ..., 12/12
function isTwinDate(dt) {
  return (dt.getMonth()+1) === dt.getDate();
}

// Payday = tanggal 25
function isPayday(dt) {
  return dt.getDate() === 25;
}

// ═══════════════════════════════════════════════
// LOGIKA KONDISI
// ═══════════════════════════════════════════════
function isExcludedFromIdle(sku) {
  return isExcluded(sku);
}

function deriveCondition(m, sku) {
  const {avg5w, avg2026, avail, wc, qtyYtd, idleWeeks, stockout5w} = m;
  const pernah = qtyYtd >= 10;

  if (pernah) {
    if (avail === 0) return 'C';
    if (idleWeeks >= 5 && stockout5w) return 'C';
    if (wc > 0 && wc < WC_KRITIS) return 'C';
    if (avg5w > 0 && avg2026 > 0 && (avg5w/avg2026) < 0.3 && wc <= WC_KRITIS) return 'C';
  }
  if (avail > 0 && idleWeeks >= 5 && !stockout5w && !isExcludedFromIdle(sku)) return 'D';
  if (avail > 0 && !pernah && !isExcludedFromIdle(sku)) return 'D';
  if (avg5w > 0 && wc > WC_AMAN) return 'B';
  return 'A';
}

const CLABEL={A:'Maintain',B:'Push',C:'Replenish',D:'Idle'};
const RS={
  A:'Pertahankan momentum, jaga promo rutin',
  B:'Boost iklan, flash sale, atau bundling',
  C:'Jaga demand; stok kosong — demand tetap ada',
  D:'Investigasi root cause, pertimbangkan clearance'
};
const RP={
  A:'Reorder sesuai jadwal, safety stock normal',
  B:'Tahan PO baru, pantau sell-through dulu',
  C:'Emergency reorder segera, eskalasi ke manager',
  D:'Stop semua PO, hitung potensi write-off/retur'
};

// ═══════════════════════════════════════════════
// KALKULASI METRICS
// ═══════════════════════════════════════════════
function calcMetrics(saleBySku, stockBySku, skuList, intakeBySkuWk) {
  const {start:w5Start, end:w5End} = get5WkWindow();
  const {start:cwStart, end:cwEnd, weekNum:curWk} = getCurrentWeekRange();
  const MS_WK = 7*24*3600*1000;
  const jan1  = new Date('2026-01-05');
  const weeksElapsed = Math.max(1, Math.floor((w5End - jan1) / MS_WK));

  // ── Hitung uplift twin date & payday dari historis ──
  // Kumpulkan semua penjualan per SKU per tanggal
  const globalTwinQty=[], globalNormQty=[], globalPayQty=[];
  for (const rows of Object.values(saleBySku)) {
    for (const r of rows) {
      if (isTwinDate(r.date)) globalTwinQty.push(r.qty);
      else if (isPayday(r.date)) globalPayQty.push(r.qty);
      else globalNormQty.push(r.qty);
    }
  }
  const avgGlobalNorm = globalNormQty.length ? globalNormQty.reduce((a,b)=>a+b,0)/globalNormQty.length : 1;
  const avgGlobalTwin = globalTwinQty.length ? globalTwinQty.reduce((a,b)=>a+b,0)/globalTwinQty.length : avgGlobalNorm*UPLIFT_TWIN_DEFAULT;
  const avgGlobalPay  = globalPayQty.length  ? globalPayQty.reduce((a,b)=>a+b,0)/globalPayQty.length   : avgGlobalNorm*UPLIFT_PAYDAY_DEFAULT;
  const globalTwinFactor = avgGlobalNorm > 0 ? avgGlobalTwin/avgGlobalNorm : UPLIFT_TWIN_DEFAULT;
  const globalPayFactor  = avgGlobalNorm > 0 ? avgGlobalPay/avgGlobalNorm  : UPLIFT_PAYDAY_DEFAULT;

  const result = {};
  for (const sku of skuList) {
    const salesAll = saleBySku[sku] || [];
    const qtyYtd = salesAll.reduce((s,r)=>s+r.qty,0);
    const revYtd = salesAll.reduce((s,r)=>s+r.rev,0);

    // Avg 5Wk
    const qty5w = salesAll.filter(r=>r.date>=w5Start&&r.date<=w5End).reduce((s,r)=>s+r.qty,0);
    const avg5w = qty5w / 5;

    // Avg 2026 per minggu
    const avg2026 = qtyYtd / weeksElapsed;

    // Idle weeks
    let idleWeeks=0;
    for (let w=0; w<26; w++) {
      const we=new Date(w5End.getTime()-w*MS_WK);
      const ws=new Date(we.getTime()-MS_WK+1);
      const hasQ=salesAll.some(r=>r.date>=ws&&r.date<=we&&r.qty>0);
      if (!hasQ) idleWeeks++; else break;
    }

    // Stok
    const stkAll = stockBySku[sku] || [];
    const stkIn5w = stkAll.filter(r=>r.date>=w5Start&&r.date<=w5End);
    const stockout5w = stkIn5w.length>0 && stkIn5w.every(r=>r.stock===0);
    let avail=0;
    if (stkAll.length>0) {
      stkAll.sort((a,b)=>b.date-a.date);
      avail = stkAll[0].stock;
    }

    // WC & Restock
    const wc = avg5w>0 ? avail/avg5w : (avail>0?9999:0);
    const restock = avg5w>0 ? Math.max(0,Math.ceil(avg5w*WC_AMAN - avail)) : 0;

    // ── Uplift per SKU dari historis ──
    const skuSales = salesAll;
    const skuNorm=[], skuTwin=[], skuPay=[];
    for (const r of skuSales) {
      if (isTwinDate(r.date)) skuTwin.push(r.qty);
      else if (isPayday(r.date)) skuPay.push(r.qty);
      else skuNorm.push(r.qty);
    }
    const skuNormAvg = skuNorm.length ? skuNorm.reduce((a,b)=>a+b,0)/skuNorm.length : 0;
    const skuTwinAvg = skuTwin.length ? skuTwin.reduce((a,b)=>a+b,0)/skuTwin.length : 0;
    const skuPayAvg  = skuPay.length  ? skuPay.reduce((a,b)=>a+b,0)/skuPay.length   : 0;

    // Uplift SKU (gunakan global sebagai fallback jika data tidak cukup)
    const twinFactor = (skuTwin.length>=2 && skuNormAvg>0)
      ? Math.max(1, skuTwinAvg/skuNormAvg)
      : globalTwinFactor;
    const payFactor = (skuPay.length>=2 && skuNormAvg>0)
      ? Math.max(1, skuPayAvg/skuNormAvg)
      : globalPayFactor;

    // ── Forecast minggu berjalan (hari per hari) ──
    // Baseline harian = avg5w / 7
    const baselineDaily = avg5w / 7;
    let forecastWk = 0;
    let hasTwinThisWk = false, hasPaydayThisWk = false;
    for (let d=0; d<7; d++) {
      const dt = new Date(cwStart);
      dt.setDate(cwStart.getDate()+d);
      if (dt > cwEnd) break;
      if (isTwinDate(dt)) {
        forecastWk += baselineDaily * twinFactor;
        hasTwinThisWk = true;
      } else if (isPayday(dt)) {
        forecastWk += baselineDaily * payFactor;
        hasPaydayThisWk = true;
      } else {
        forecastWk += baselineDaily;
      }
    }
    forecastWk = Math.round(forecastWk);

    // Intake plan minggu berjalan
    const intakeKey = `${curWk}_${sku.toUpperCase()}`;
    const intakeWk = intakeBySkuWk[intakeKey] || 0;

    // WSSI closing stock
    const closingStock = Math.max(0, avail + intakeWk - forecastWk);
    const wcForward = avg5w>0 ? closingStock/avg5w : (closingStock>0?9999:0);

    // Uplift label untuk display
    const upliftLabel = hasTwinThisWk ? `Twin×${twinFactor.toFixed(1)}`
      : hasPaydayThisWk ? `Payday×${payFactor.toFixed(1)}` : '';

    result[sku] = {
      qtyYtd, revYtd, avg5w, avg2026, avail, wc, restock,
      idleWeeks, stockout5w,
      forecastWk, intakeWk, closingStock, wcForward,
      twinFactor, payFactor, upliftLabel, curWk
    };
  }
  return result;
}

// ═══════════════════════════════════════════════
// LOAD DATA
// ═══════════════════════════════════════════════
async function init() {
  ['page-overview','page-sku','page-wssi','page-alert'].forEach(id => {
    document.getElementById(id).innerHTML =
      '<div class="st"><div class="spin"></div><div id="lmsg">Memuat data...</div><div class="pw"><div class="pb" id="prog" style="width:5%"></div></div></div>';
  });

  try {
    setMsg('Memuat data penjualan harian...', 15);
    const saleRows  = await fetchCSV(GID_SALE,   'daily_sale');
    setMsg('Memuat data stok harian...', 38);
    const stockRows = await fetchCSV(GID_STOCK,  'daily_stock');
    setMsg('Memuat rencana intake...', 58);
    const intakeRows= await fetchCSV(GID_INTAKE, 'intake_plan');
    setMsg('Menghitung metrics & forecast...', 72);

    // ── Parse daily_sale: date|month|week|SKU|qty_sold|revenue ──
    const shi = findHdr(saleRows, 'date','sku');
    if (shi<0) throw new Error('Header tidak ditemukan di tab daily_sale. Baris pertama: '+(saleRows[0]||[]).join(' | '));
    const shdr = saleRows[shi].map(c=>c.toLowerCase().trim());
    const sD=col(shdr,['date'],0), sSku=col(shdr,['sku'],3),
          sQ=col(shdr,['qty'],4), sR=col(shdr,['revenue','rev'],5);

    const saleBySku={};
    for (let i=shi+1; i<saleRows.length; i++) {
      const r=saleRows[i];
      const sku=(r[sSku]||'').trim(); if(!sku) continue;
      const dt=new Date(r[sD]||''); if(isNaN(dt.getTime())) continue;
      const qty=pNum(r[sQ]), rev=pNum(r[sR]);
      if (!saleBySku[sku]) saleBySku[sku]=[];
      saleBySku[sku].push({date:dt, qty, rev});
    }

    // ── Parse daily_stock: date|month|week|SKU|available_stock ──
    const sthi = findHdr(stockRows,'date','sku');
    if (sthi<0) throw new Error('Header tidak ditemukan di tab daily_stock. Baris pertama: '+(stockRows[0]||[]).join(' | '));
    const sthdr=stockRows[sthi].map(c=>c.toLowerCase().trim());
    const stD=col(sthdr,['date'],0), stSku=col(sthdr,['sku'],3),
          stStk=col(sthdr,['available','avail','stock'],4);

    const stockBySku={};
    for (let i=sthi+1; i<stockRows.length; i++) {
      const r=stockRows[i];
      const sku=(r[stSku]||'').trim(); if(!sku) continue;
      const dt=new Date(r[stD]||''); if(isNaN(dt.getTime())) continue;
      const stk=pNum(r[stStk]);
      if (!stockBySku[sku]) stockBySku[sku]=[];
      stockBySku[sku].push({date:dt, stock:stk});
    }

    // ── Parse intake_plan: week|SKU|qty_intake ──
    const ihi = findHdr(intakeRows,'week','sku');
    const intakeBySkuWk={};
    if (ihi>=0) {
      const ihdr=intakeRows[ihi].map(c=>c.toLowerCase().trim());
      const iW=col(ihdr,['week'],0), iSku=col(ihdr,['sku'],1),
            iQ=col(ihdr,['qty','intake','plan'],2);
      for (let i=ihi+1; i<intakeRows.length; i++) {
        const r=intakeRows[i];
        const wk=pNum(r[iW]), sku=(r[iSku]||'').trim().toUpperCase();
        const qty=pNum(r[iQ]);
        if (!wk||!sku||!qty) continue;
        intakeBySkuWk[`${wk}_${sku}`]=qty;
      }
    }

    // ── Rank dari revenue YTD ──
    const revBySku={};
    for (const [sku,rows] of Object.entries(saleBySku)) {
      if (isExcluded(sku)) continue;
      revBySku[sku]=rows.reduce((s,r)=>s+r.rev,0);
    }
    const rankMap={};
    Object.entries(revBySku).sort((a,b)=>b[1]-a[1]).slice(0,TOP_N)
      .forEach(([sku],i)=>{ rankMap[sku]=i+1; });

    if (!Object.keys(rankMap).length)
      throw new Error('Tidak ada data penjualan. Pastikan tab daily_sale sudah publik.');

    // ── Hitung metrics ──
    setMsg('Menghitung WC, forecast, WSSI...', 88);
    const skuList=Object.keys(rankMap).sort((a,b)=>rankMap[a]-rankMap[b]);
    const metrics=calcMetrics(saleBySku, stockBySku, skuList, intakeBySkuWk);

    ALL = skuList.map(sku => {
      const m=metrics[sku];
      const cond=deriveCondition(m, sku);
      return {
        rank:rankMap[sku], sku,
        qty:m.qtyYtd, total_value:m.revYtd,
        avail:m.avail, avg5w:m.avg5w, avg2026:m.avg2026,
        wc:m.wc, restock:m.restock,
        forecastWk:m.forecastWk, intakeWk:m.intakeWk,
        closingStock:m.closingStock, wcForward:m.wcForward,
        upliftLabel:m.upliftLabel, curWk:m.curWk,
        condition:cond, rec_s:RS[cond], rec_p:RP[cond]
      };
    });

    document.getElementById('ts').textContent =
      new Date().toLocaleString('id-ID',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});

    applyFilt();
    renderAll();

  } catch(e) {
    const html=`<div class="st">
      <div style="color:#B83030;font-size:28px">⚠</div>
      <div style="font-weight:600">${e.message}</div>
      <div style="font-size:11px;color:var(--mt);max-width:440px;text-align:center">
        Pastikan Google Sheets diset <strong>"Anyone with the link can view"</strong>
        dan ketiga tab (daily_sale, daily_stock, intake_plan) bisa diakses.
      </div>
      <button class="rfbtn" style="background:var(--gd);margin-top:10px" onclick="init()">↻ Coba Lagi</button>
    </div>`;
    ['page-overview','page-sku','page-wssi','page-alert'].forEach(id=>{
      document.getElementById(id).innerHTML=html;
    });
  }
}

function findHdr(rows, ...kws) {
  for (let i=0; i<Math.min(rows.length,30); i++) {
    const j=rows[i].join('|').toLowerCase();
    if (kws.every(k=>j.includes(k))) return i;
  }
  return -1;
}
function col(hdr, keys, fallback) {
  const i=hdr.findIndex(c=>keys.some(k=>c.includes(k)));
  return i>=0 ? i : fallback;
}

// ═══════════════════════════════════════════════
// FILTER & SORT
// ═══════════════════════════════════════════════
function applyFilt() {
  filtered=ALL.filter(d=>{
    const mF=filt==='ALL'||d.condition===filt;
    const mS=!srch||d.sku.toLowerCase().includes(srch.toLowerCase());
    return mF&&mS;
  });
  filtered.sort((a,b)=>{
    const av=a[sCol],bv=b[sCol];
    if (typeof av==='string') return sDir==='asc'?av.localeCompare(bv):bv.localeCompare(av);
    return sDir==='asc'?av-bv:bv-av;
  });
  pg=1;
}

// ═══════════════════════════════════════════════
// FORMAT
// ═══════════════════════════════════════════════
function fN(n){return n?Math.round(n).toLocaleString('id-ID'):'—'}
function fRp(n){
  if(!n) return '—';
  if(n>=1e9) return 'Rp'+(n/1e9).toFixed(2)+' M';
  if(n>=1e6) return 'Rp'+(n/1e6).toFixed(1)+' jt';
  return 'Rp'+Math.round(n).toLocaleString('id-ID');
}
function wcCol(c){return{A:'#264C47',B:'#E67E22',C:'#B83030',D:'#B0A899'}[c]||'#888'}
function wcW(wc){return wc>=9999?100:Math.min(100,(wc/30)*100)}
function thc(c){return sCol===c?(sDir==='asc'?'sa':'sd'):''}

// ═══════════════════════════════════════════════
// DONUT SVG
// ═══════════════════════════════════════════════
function donut(segs) {
  const cx=60,cy=60,r=44,gap=2.5;
  let paths='',cum=-Math.PI/2;
  const tot=segs.reduce((s,d)=>s+d.n,0)||1;
  segs.forEach(s=>{
    const angle=(s.n/tot)*Math.PI*2;
    const end=cum+angle-(gap/r);
    const x1=cx+r*Math.cos(cum),y1=cy+r*Math.sin(cum);
    const x2=cx+r*Math.cos(end),y2=cy+r*Math.sin(end);
    paths+=`<path d="M${cx} ${cy} L${x1} ${y1} A${r} ${r} 0 ${angle>Math.PI?1:0} 1 ${x2} ${y2}Z" fill="${s.color}" opacity=".88"/>`;
    cum+=angle;
  });
  return `<svg width="120" height="120" viewBox="0 0 120 120">
    <circle cx="60" cy="60" r="44" fill="#F0EDE8"/>
    ${paths}
    <circle cx="60" cy="60" r="24" fill="white"/>
    <text x="60" y="57" text-anchor="middle" font-size="16" font-weight="700" fill="#264C47" font-family="Georgia,serif">${tot}</text>
    <text x="60" y="70" text-anchor="middle" font-size="8" fill="#6B7870" font-family="sans-serif">SKU</text>
  </svg>`;
}

function renderWSVI_rows(skus, weekNums) {
  return skus.slice(0,20).map(d=>{
    const wkCells = weekNums.map(wk=>{
      const isCur = wk===d.curWk;
      const cls = isCur?'cur-wk':'';
      if (wk===d.curWk) {
        const cs = d.closingStock;
        const pos = cs > 0;
        return `<td class="nm ${cls}">
          <div style="font-size:10px;color:var(--mt)">+${fN(d.intakeWk)}/−${fN(d.forecastWk)}</div>
          <div class="${pos?'wssi-pos':'wssi-neg'}">${fN(cs)}</div>
        </td>`;
      }
      return `<td class="nm ${cls}">—</td>`;
    }).join('');
    return `<tr>
      <td class="rk">${d.rank}</td>
      <td class="sk">${d.sku}</td>
      <td class="nm">${fN(d.avail)}</td>
      ${wkCells}
      <td><span class="bdg b${d.condition}"><span class="bdd"></span>${d.condition}</span></td>
    </tr>`;
  }).join('');
}

function renderWSII_alias() { renderWSII(); }

function renderWSII() {
  const curWk = ALL[0]?.curWk || 0;
  const weekNums = [curWk-1, curWk, curWk+1, curWk+2];
  const critSku = ALL.filter(d=>d.condition==='C').sort((a,b)=>a.rank-b.rank);
  const allForWSII = ALL.filter(d=>d.condition!=='D').sort((a,b)=>a.rank-b.rank);

  function wsiRows(skus) {
    return skus.slice(0,20).map(d=>{
      const cells = weekNums.map(wk=>{
        const isCur=wk===d.curWk;
        const cls=isCur?'cur-wk':'';
        if (isCur) {
          const pos=d.closingStock>0;
          return `<td class="nm ${cls}">
            <div style="font-size:9px;color:var(--mt)">+${fN(d.intakeWk)} / −${fN(d.forecastWk)}</div>
            <div class="${pos?'wssi-pos':'wssi-neg'}" style="font-size:12px">${fN(d.closingStock)}</div>
          </td>`;
        }
        return `<td class="nm ${cls}" style="color:var(--g4)">—</td>`;
      }).join('');
      return `<tr>
        <td class="rk">${d.rank}</td><td class="sk">${d.sku}</td>
        <td class="nm">${fN(d.avail)}</td>${cells}
        <td><span class="bdg b${d.condition}"><span class="bdd"></span>${d.condition}</span></td>
      </tr>`;
    }).join('');
  }

  const thWks=weekNums.map(w=>`<th style="text-align:right${w===curWk?';background:#E8F4F1;color:var(--gd)':''}">${w===curWk?`W${w} ★`:`W${w}`}</th>`).join('');

  document.getElementById('page-wssi').innerHTML=`
  <div style="margin-bottom:14px;padding:12px 16px;background:var(--ca-bg);border-radius:8px;font-size:12px;color:var(--gd);border-left:3px solid var(--gd)">
    <strong>WSSI Forward-Looking</strong> · Closing Stock = Avail + Intake W${curWk} − Forecast W${curWk}.
    Uplift forecast otomatis: <strong>Twin Date</strong> (tanggal kembar) dan <strong>Payday</strong> (tgl 25) dihitung dari rasio historis masing-masing SKU vs hari normal.
  </div>
  <div class="wssi-wrap">
    <div class="wssi-title">Top 20 SKU — WSSI Closing Stock <span class="wssi-note">★ = minggu berjalan · +intake / −forecast</span></div>
    <div class="wssi-tbl" style="overflow-x:auto"><table>
      <thead><tr><th>#</th><th>SKU</th><th style="text-align:right">Avail</th>${thWks}<th>Kondisi</th></tr></thead>
      <tbody>${wsiRows(allForWSII)}</tbody>
    </table></div>
  </div>
  <div class="wssi-wrap">
    <div class="wssi-title" style="color:var(--cc)">🔴 Kondisi C — Closing Stock Kritis <span class="wssi-note">${critSku.length} SKU</span></div>
    <div class="wssi-tbl" style="overflow-x:auto"><table>
      <thead><tr><th>#</th><th>SKU</th><th style="text-align:right">Avail</th>${thWks}<th>Kondisi</th></tr></thead>
      <tbody>${wsiRows(critSku)}</tbody>
    </table></div>
  </div>`;
}

function renderAlert() {
  function grid(items,bg,border,tc) {
    return items.map(d=>`<div class="al-item" style="background:${bg};border-color:${border}">
      <div style="color:${tc}">#${d.rank} ${d.sku}</div>
      <div class="al-rev">${fRp(d.total_value)}</div>
      <div class="al-wc" style="color:${tc}">WC: ${d.wc>=9999?'∞':d.wc.toFixed(1)}x · RS: ${d.restock>0?'+'+fN(d.restock):'—'}</div>
      <div class="al-fc">FC W${d.curWk}: ${fN(d.forecastWk)} unit${d.upliftLabel?' · '+d.upliftLabel:''}</div>
    </div>`).join('');
  }
  const C=ALL.filter(d=>d.condition==='C').sort((a,b)=>a.rank-b.rank);
  const B=ALL.filter(d=>d.condition==='B').sort((a,b)=>a.rank-b.rank);
  const D=ALL.filter(d=>d.condition==='D').sort((a,b)=>a.rank-b.rank);

  document.getElementById('page-alert').innerHTML=`
  <div class="al-card">
    <div class="al-ttl" style="color:var(--cc)">🔴 C — Replenish Segera <span class="al-chip" style="background:var(--cc-bg);color:var(--cc)">${C.length} SKU</span></div>
    <div style="font-size:11px;color:var(--mt);margin-bottom:10px"><strong>Sales:</strong> Jaga demand, pertahankan promo. <strong>Purchasing:</strong> Emergency reorder — eskalasi ke manager sekarang.</div>
    <div class="al-grid">${grid(C,'#FDECEA','#E8A8A8','#B83030')}</div>
  </div>
  <div class="al-card">
    <div class="al-ttl" style="color:var(--cb2)">🟡 B — Push Penjualan <span class="al-chip" style="background:var(--cb-bg);color:var(--cb2)">${B.length} SKU</span></div>
    <div style="font-size:11px;color:var(--mt);margin-bottom:10px"><strong>Sales:</strong> Boost iklan, flash sale, bundling. <strong>Purchasing:</strong> Tahan semua PO baru sampai WC turun di bawah 12.</div>
    <div class="al-grid">${grid(B,'#FEF3DC','#D4A84B','#8B5E0A')}</div>
  </div>
  <div class="al-card">
    <div class="al-ttl" style="color:var(--cd)">⚫ D — Idle / Review Strategis <span class="al-chip" style="background:var(--cd-bg);color:var(--cd)">${D.length} SKU</span></div>
    <div style="font-size:11px;color:var(--mt);margin-bottom:10px"><strong>Sales:</strong> Clearance, reposition, atau discontinue. <strong>Purchasing:</strong> Stop semua PO — keputusan butuh level Manager/CEO.</div>
    <div class="al-grid">${grid(D,'#EEEBE6','#B0A899','#5F5955')}</div>
  </div>`;
}

function showPage(id,btn) {
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('act'));
  document.querySelectorAll('.nb').forEach(b=>b.classList.remove('act'));
  document.getElementById('page-'+id).classList.add('act');
  btn.classList.add('act');
}
function doFilt(f){filt=f;applyFilt();renderSKU();}
function doSrch(v){srch=v;applyFilt();renderSKU();}
function doSort(col){sCol=col;sDir=col==='rank'||col==='wc'?'asc':'desc';applyFilt();renderSKU();}
function tSort(col){if(sCol===col)sDir=sDir==='asc'?'desc':'asc';else{sCol=col;sDir=col==='rank'||col==='wc'?'asc':'desc';}applyFilt();renderSKU();}
function goPg(p){const t=Math.ceil(filtered.length/PG);if(p<1||p>t)return;pg=p;renderSKU();window.scrollTo({top:0,behavior:'smooth'});}

init();
